id: stage29_pre_scale_decision_review
name: Stage 29 Pre-Scale Decision Review
task_type: project_improvement
prompt: >
  Read frozen Stage 26, Stage 27, and Stage 28 evidence to decide whether the
  project is ready for a larger policy-gradient pilot, should repair a blocker,
  or should hold training. Stage 29 is a decision-review stage only and must not
  run training, tune rewards, switch samplers, create checkpoints, or approve
  scale-up.
controlled_object: >
  The pre-scale owner decision gate after the repaired-critic small-scale rerun:
  Stage 26 component health evidence, Stage 27 selected critic evidence, Stage
  28 repaired-critic rerun evidence, scale-readiness decision rows, root-cause
  matrix, PROJECT_STATE, harness registry, and post-task self-review.
desired_state: >
  A data-backed decision packet identifies whether critic repair cleared the
  main Stage 25 blocker, which blockers remain, whether a larger pilot or
  scale-up is allowed, the exact recommended Stage 30, and which work remains
  owner-gated. No actor update, policy-gradient run, reward tuning, sampler
  switch, checkpoint, recurrent model, forbidden architecture, final tau
  selection, v5 modification, or unmanifested artifact write occurs.
stage_boundary: >
  Stage 29 may only read existing Stage 26-28 reports, produce documentation,
  update tests/harness/state, and recommend one next owner-approved stage. It
  must not run new training, run diagnostic probes, modify reward weights,
  change the active stack, select final tau, switch sampler, write checkpoints,
  run scale-up, implement COMA/Transformer/GRU/LSTM/recurrent PPO, or modify v5.
acceptance_criteria: >
  PASS requires a generated Stage 29 pre-scale decision review, scale-readiness
  scorecard, root-cause and decision packet, tests proving no training/tuning
  or artifact-scope violation, PROJECT_STATE synchronized to Stage 29 closeout,
  harness task registered, post-task self-review produced, pytest passing,
  harness validation passing, and the next stage recommended without
  self-authorization.
failure_criteria: >
  FAIL if Stage 26-28 evidence cannot be read, the decision packet lacks
  component-level evidence, scale-up or a larger pilot is approved without
  resolving blockers, forbidden training/tuning/checkpoint/architecture/v5 work
  occurs, PROJECT_STATE or harness cannot be synchronized, or validation fails.
post_task_self_review_requirement: >
  Closeout must answer whether critic remains the main blocker, whether
  reward/objective mismatch remains a blocker, whether projection remains a
  blocker, whether data remains a scale blocker, whether a larger pilot is
  approved, whether scale-up is approved, whether recurrent policy work remains
  blocked, and the exact recommended Stage 30.
required_artifacts:
  - docs/STAGE29_PRE_SCALE_DECISION_REVIEW.md
  - docs/STAGE29_SCALE_READINESS_SCORECARD.md
  - docs/STAGE29_ROOT_CAUSE_AND_DECISION_PACKET.md
  - src/marl_topology/evaluation/stage29_pre_scale_decision.py
  - scripts/replay/stage29_pre_scale_decision_review.py
  - tests/unit/test_stage29_pre_scale_decision.py
  - tests/contract/test_stage29_no_training_or_tuning.py
  - tests/contract/test_stage29_decision_report_coverage.py
  - harness/reports/post_task_self_review_stage29.md
  - docs/PROJECT_STATE.md
expected_evidence:
  - Stage 29 reads Stage 26, Stage 27, and Stage 28 report artifacts
  - Critic baseline is marked repaired after Stage 27/28 evidence
  - Reward/objective alignment is marked blocking because Stage 28 latency and energy improved while surrogate reward worsened
  - Projection alignment is marked blocking because top proposal rejection worsened
  - Data remains scale-blocking based on Stage 26 small-pilot-only evidence
  - Larger pilot approved is false and scale-up approved is false
  - Recommended next task is stage_30_reward_objective_projection_alignment_repair
  - PROJECT_STATE records Stage 29 closeout and keeps owner decision required
negative_checks:
  - New training updates, diagnostic probes, or larger pilot are run
  - Reward weights, hyperparameters, sampler, active actor, evaluator, tau, or action semantics are changed
  - Checkpoint creation, scale-up, COMA, Transformer, GRU/LSTM, recurrent PPO, or v5 migration occurs
  - Stage 29 creates a result_save artifact directory outside the required docs/harness closeout surface
  - The next recommended stage is treated as self-authorized
rubric_items:
  - controlled_object_identified
  - desired_state_defined
  - state_variables_defined
  - sensors_defined
  - actuators_defined
  - feedback_loop_present
  - verification_plan_present
  - stability_risk_checked
  - observability_gap_checked
  - controllability_checked
  - disturbance_checked
  - delay_or_async_risk_checked
  - noise_or_flakiness_checked
  - decoupling_checked
  - reliability_or_error_control_checked
  - persistent_learning_update_suggested
pass_threshold: 90
minimum_required_items:
  - controlled_object_identified
  - desired_state_defined
  - state_variables_defined
  - sensors_defined
  - verification_plan_present
  - observability_gap_checked
  - decoupling_checked
  - reliability_or_error_control_checked
source_awareness_required: true
rule_basis:
  - EC-RULE-001
  - EC-RULE-004
  - EC-RULE-008
  - EC-RULE-010
  - EC-RULE-028
  - EC-RULE-029
  - EC-RULE-034
expected_outputs:
  - Stage 29 pre-scale decision review
  - Stage 29 scale-readiness scorecard
  - Stage 29 root-cause decision packet
  - Stage 29 post-task self-review
