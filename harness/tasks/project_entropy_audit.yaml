id: project_entropy_audit
name: Project Entropy Audit
task_type: project_analysis
prompt: >
  Audit MARL-Topology for code entropy, phase-script growth, duplicate metric semantics,
  uncontrolled migration, and missing sensors before proposing bounded cleanup.
required_artifacts:
  - entropy inventory
  - duplicate semantic list
  - phase-script risk list
  - bounded actuator proposal
expected_evidence:
  - file inventory
  - grep results for metric and reward names
  - migration ledger references
  - proposed contract tests
rubric_items:
  - controlled_object_identified
  - desired_state_defined
  - state_variables_defined
  - sensors_defined
  - actuators_defined
  - feedback_loop_present
  - verification_plan_present
  - stability_risk_checked
  - observability_gap_checked
  - controllability_checked
  - disturbance_checked
  - delay_or_async_risk_checked
  - noise_or_flakiness_checked
  - decoupling_checked
  - reliability_or_error_control_checked
  - persistent_learning_update_suggested
pass_threshold: 80
minimum_required_items:
  - desired_state_defined
  - sensors_defined
  - verification_plan_present
negative_checks:
  - proposes broad rewrite without baseline
  - moves legacy code without migration ledger entry
  - treats phase scripts as durable core modules
source_awareness_required: true
rule_basis:
  - EC-RULE-001
  - EC-RULE-004
  - EC-RULE-007
  - EC-RULE-010
  - EC-RULE-013

