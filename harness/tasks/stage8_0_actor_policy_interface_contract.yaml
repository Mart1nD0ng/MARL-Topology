id: stage8_0_actor_policy_interface_contract
name: Stage 8.0 Actor Policy Interface Contract
task_type: project_improvement
prompt: >
  Define the actor policy interface that consumes Stage 6 actor-safe rows and
  respects Stage 7 evidence separation. Freeze actor input and output schemas,
  keep critic and learning-target views training-only, and do not implement
  actor or critic model code, training, checkpoints, reward-weight calibration,
  final tau selection, or v5 migration.
required_artifacts:
  - Stage 8.0 actor policy interface contract document
  - structured policy interface contract module
  - replay script that prints the contract without writing artifacts
  - unit tests for input and output schema validation
  - contract tests for docs task project state and source boundaries
  - PROJECT_STATE update marking Stage 8.0 complete and awaiting owner decision
  - post-task self-review report
expected_evidence:
  - actor policy input schema equals Stage 6.1 actor-safe fields
  - actor policy output schema is local edge decisions only
  - objective metrics oracle labels learning targets surrogate diagnostics and centralized views are rejected from actor inputs
  - joint topology assembly remains environment-side
  - critic centralized view is reference-only and training-only
  - no model training checkpoint artifact export weight calibration final tau selection or v5 migration is introduced
rubric_items:
  - controlled_object_identified
  - desired_state_defined
  - state_variables_defined
  - sensors_defined
  - actuators_defined
  - feedback_loop_present
  - verification_plan_present
  - stability_risk_checked
  - observability_gap_checked
  - controllability_checked
  - disturbance_checked
  - decoupling_checked
  - reliability_or_error_control_checked
  - persistent_learning_update_suggested
pass_threshold: 85
minimum_required_items:
  - desired_state_defined
  - sensors_defined
  - verification_plan_present
  - decoupling_checked
  - reliability_or_error_control_checked
negative_checks:
  - actor input schema includes objective metrics or oracle labels
  - actor input schema includes centralized critic or learning-target views
  - actor output schema emits selected global topology instead of local decisions
  - joint topology assembly is moved into the actor interface
  - actor or critic model implementation is added
  - training execution checkpoint creation artifact export or reward-weight calibration is introduced
  - final tau selection or v5 code migration is introduced
source_awareness_required: true
rule_basis:
  - EC-RULE-001
  - EC-RULE-004
  - EC-RULE-008
  - EC-RULE-010
  - EC-RULE-028
  - EC-RULE-029
  - EC-RULE-034
relevant_lessons:
  - L001_metric_governance_first
  - L003_full_mask_not_oracle
  - L004_policy_failure_not_infeasible
  - L009_dec_pomdp_boundary_before_actor
  - L010_training_after_oracle_baseline_contracts
required_tests:
  - actor policy input schema matches actor-safe batch fields
  - actor policy input validation rejects objective metrics oracle labels learning targets surrogate diagnostics and global topology
  - actor policy output validation rejects global topology selected edge ids metrics and learning targets
  - contract report states model training checkpoint artifact export and v5 migration are blocked
  - source scan rejects training model checkpoint v5 and legacy metric terms
forbidden_v5_inheritance:
  - old actor critic checkpoint loading
  - old reward formulas weights or shortcut labels
  - old metric aliases or effective-success naming
  - old phase policy interfaces
  - old oracle labels as deployment actor inputs
expected_outputs:
  - Stage 8.0 interface summary
  - actor input and output schema ids
  - training-only critic and learning-target boundary statement
  - Stage 8.1 owner-decision recommendation
  - owner decision required marker
