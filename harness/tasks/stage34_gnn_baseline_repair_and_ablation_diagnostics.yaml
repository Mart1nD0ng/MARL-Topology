id: stage34_gnn_baseline_repair_and_ablation_diagnostics
name: Stage 34 GNN Evaluation Baseline Repair and Ablation Diagnostics
task_type: project_improvement
prompt: >
  Repair the Stage33 evaluation baseline, define strict graph-necessity metrics,
  expose the seven required GNN ablation baselines, collect logit/KL/gradient
  diagnostics, and close with either one selected production GNN or a blocker
  report. MLP remains diagnostic only.
controlled_object: >
  Stage34 evaluation baseline: graph-necessity dataset contract, metric-derived
  graph necessity labels, official mappo production adapter path, seven GNN
  ablation registry, diagnostic protocol, report artifacts, active model
  registry, and project state.
desired_state: >
  Stage34 no longer relies on the tiny Stage33 baseline. The required dataset
  scale, graph-necessity metrics, seven GNN ablations, logit/KL/gradient
  diagnostics, and official adapter boundary are implemented. A winner is
  selected only after the full protocol completes; otherwise owner decision is
  required with no MLP fallback.
repaired_baseline_requirement: >
  The baseline must require at least seven families, at least 50 samples per
  family, at least 350 total scenarios, stratified train/eval/test splits, no
  leakage, duplicate_context_rate=0, and declared actual node_count_choices.
graph_necessity_data_requirement: >
  Dataset and metrics must use Stage3/4 evaluator semantics and Stage5 objective
  boundaries, with no SimpleLinkModel fallback, no min-link skeleton fallback,
  and no graph-necessity labels assigned from family name alone.
seven_ablation_baselines: >
  Exactly these seven ablations must be registered: v2_reference,
  v2_plus_residual, v2_plus_norm, v2_plus_role_features,
  v2_plus_resource_features, v2_plus_depth_2_3, and v3_current.
logit_kl_diagnostic_requirement: >
  Each ablation must expose finite pre-update logit/probability/entropy
  diagnostics and the per-update diagnostic schema must include approx_kl_mean,
  approx_kl_max, clip_fraction, entropy, actor/critic grad norm, logprob ratio,
  score shift, parameter delta, losses, and advantage stats.
low_entropy_cleanup_requirement: >
  MLP cannot be production. Multiple active production GNNs are not allowed.
  Losing variants may remain diagnostic-only, but active promotion requires the
  full Stage34 selection gate.
no_reward_tuning_requirement: >
  tau_requirement_min remains 0.9; reward weights, Stage3 reliability, Stage4
  expected-initiator PBFT, final tau, COMA, Transformer, GRU/LSTM, recurrent PPO,
  sampler, assembler, action semantics, and v5 remain unchanged.
pass_fail_gate: >
  PASS requires repaired baseline materialized at required scale, all seven
  ablations evaluated with official adapter under the full protocol, diagnostics
  complete, selected GNN collapse_rate <= 20 percent, selected GNN matching or
  beating MLP diagnostic on graph-necessity families, no boundary violations,
  exactly one active production GNN selected, and passing tests/harness. FAIL
  requires a blocker report and no MLP production fallback.
post_task_self_review_requirement: >
  Closeout must answer whether Stage33 baseline was repaired, sample count per
  family, graph-necessity metric credibility, smoke-mode avoidance, winning
  ablation, collapse cause, logit/KL findings, whether v2 remains best, active
  production selection, losing variant cleanup, and whether Stage35 is allowed.
required_artifacts:
  - docs/STAGE34_GNN_EVALUATION_BASELINE_REPAIR_AND_ABLATION.md
  - docs/STAGE34_BASELINE_PREFLIGHT.md
  - docs/STAGE34_GRAPH_NECESSITY_DATASET.md
  - docs/STAGE34_GRAPH_NECESSITY_METRICS.md
  - docs/STAGE34_TRAINING_PROTOCOL_BASELINE.md
  - docs/STAGE34_GNN_ABLATION_BASELINES.md
  - docs/STAGE34_LOGIT_KL_STABILITY_DIAGNOSTICS.md
  - docs/STAGE34_GNN_ABLATION_RESULTS.md
  - docs/STAGE34_GNN_ABLATION_FAILURE_REVIEW.md
  - src/marl_topology/data/stage34_graph_necessity_dataset.py
  - src/marl_topology/evaluation/graph_necessity_metrics.py
  - src/marl_topology/evaluation/stage34_gnn_diagnostics.py
  - src/marl_topology/models/gnn_ablation_registry.py
  - scripts/train/stage34_gnn_ablation_diagnostic_training.py
  - scripts/replay/stage34_gnn_failure_attribution_report.py
  - tests/unit/test_stage34_graph_necessity_dataset.py
  - tests/unit/test_stage34_graph_necessity_metrics.py
  - tests/unit/test_stage34_gnn_ablation_registry.py
  - tests/unit/test_stage34_logit_kl_diagnostics.py
  - tests/contract/test_stage34_training_protocol_baseline.py
  - tests/contract/test_stage34_no_toy_gnn_no_reward_tuning.py
  - tests/contract/test_stage34_gnn_selection_gate.py
  - harness/reports/post_task_self_review_stage34.md
  - docs/PROJECT_STATE.md
expected_evidence:
  - Stage34 config enforces samples_per_family >= 50 and total_scenarios >= 350
  - Stage34 graph-necessity label is metric-derived and false when local heuristic equals teacher
  - Stage34 protocol rejects smoke mode and tiny scenario counts
  - Seven GNN ablations are registered and actor-safe
  - Logit/update diagnostics are finite and include max KL
  - Official adapter reports Stage32 custom loop not called
  - Diagnostic script writes manifest-validated report artifacts
  - Failure report records owner decision required if full protocol is not completed
negative_checks:
  - Using Stage33 seven-scenario smoke protocol for architecture selection
  - Assigning graph_necessary by family name alone
  - Calling Stage32 custom training loop
  - Promoting MLP to production
  - Introducing reward tuning, final tau, COMA, Transformer, GRU/LSTM, recurrent PPO, or v5 migration
  - Keeping multiple active production GNNs after a pass
  - Writing artifacts outside manifest-approved result_save root
