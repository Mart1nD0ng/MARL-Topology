id: stage5_7_policy_architecture_contract
name: Stage 5.7 Policy Architecture Contract Without Implementation
task_type: project_improvement
prompt: >
  Freeze a design-only policy architecture contract after Stage 5.6. The task
  must define deployment actor input boundaries future actor options
  centralized-training view boundaries critic-only fields serialization rules
  credit-assignment boundaries and leakage tests. It must not implement actor
  or critic code, run training, create checkpoints, calibrate weights, select
  final tau, or migrate v5 code.
required_artifacts:
  - design-only policy architecture contract manifest
  - replay script for Stage 5.7 contract report
  - Stage 5.7 policy architecture contract document
  - durable policy architecture contract document
  - Dec-POMDP training replay and project-state updates
  - unit tests for structured architecture contract behavior
  - contract tests for Stage 5.7 boundary
  - post-task self-review report
expected_evidence:
  - verdict is architecture_contract_frozen_implementation_blocked
  - implementation_allowed is false
  - training_execution_allowed is false
  - deployment actor boundary is local-only
  - centralized training view is training-only
  - credit assignment is not selected
  - checkpoint creation remains blocked
  - no training model code reward weight calibration final tau selection or v5 migration occurs
rubric_items:
  - controlled_object_identified
  - desired_state_defined
  - state_variables_defined
  - sensors_defined
  - actuators_defined
  - feedback_loop_present
  - verification_plan_present
  - stability_risk_checked
  - observability_gap_checked
  - controllability_checked
  - disturbance_checked
  - decoupling_checked
  - reliability_or_error_control_checked
  - persistent_learning_update_suggested
pass_threshold: 85
minimum_required_items:
  - desired_state_defined
  - sensors_defined
  - verification_plan_present
  - reliability_or_error_control_checked
negative_checks:
  - actor or critic implementation is added
  - training execution is allowed by the contract
  - checkpoint creation or loader code is added
  - centralized training fields enter deployment actor inputs
  - credit assignment is selected without calibration evidence
  - scalarization weights are selected or calibrated
  - final tau lower than 0.9 is selected or recommended
  - old v5 reward formulas weights aliases phase scripts or P_eff names are introduced
source_awareness_required: true
rule_basis:
  - EC-RULE-001
  - EC-RULE-004
  - EC-RULE-008
  - EC-RULE-010
  - EC-RULE-028
  - EC-RULE-029
  - EC-RULE-034
relevant_lessons:
  - L001_metric_governance_first
  - L002_effective_success_alias_risk
  - L007_credit_calibration_not_impossibility
  - L009_dec_pomdp_boundary_before_actor
  - L010_training_after_oracle_baseline_contracts
  - L011_debug_hypotheses_need_status
required_tests:
  - Stage 5.7 document exists and states no implementation
  - structured architecture contract blocks implementation and training
  - deployment actor allowed and forbidden inputs are explicit
  - centralized training view remains training-only
  - credit assignment is not selected
  - replay script prints the Stage 5.7 contract
  - project state recommends Stage 5.8 learning target replay contract only
  - source scan rejects training model v5 and legacy metric terms
forbidden_v5_inheritance:
  - old actor or critic checkpoint loading
  - old full-graph actor tensors
  - old oracle labels as actor inputs
  - old reward formulas weights penalties or sentinel constants
  - old effective-success metric aliases
  - old phase scripts as architecture or training entry points
expected_outputs:
  - design-only policy architecture contract
  - blocked implementation list
  - recommended Stage 5.8 learning target replay contract task
  - owner decision required marker
