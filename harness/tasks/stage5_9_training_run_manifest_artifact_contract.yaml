id: stage5_9_training_run_manifest_artifact_contract
name: Stage 5.9 Training Run Manifest And Artifact Contract Without Execution
task_type: project_improvement
prompt: >
  Freeze a design-only run manifest and artifact contract after Stage 5.8. The
  task must define future manifest fields artifact roots artifact groups
  retention policy seed/config identifiers contract ids metric registry markers
  and reproducibility checks. It must not write artifacts, implement manifest
  writers, export datasets, create checkpoints, run training, add model code,
  calibrate weights, select final tau, or migrate v5 code.
required_artifacts:
  - design-only run manifest artifact contract manifest
  - replay script for Stage 5.9 contract report
  - Stage 5.9 run manifest artifact contract document
  - durable run manifest artifact contract document
  - training metric project-state updates
  - unit tests for structured artifact contract behavior
  - contract tests for Stage 5.9 boundary
  - post-task self-review report
expected_evidence:
  - verdict is run_manifest_artifact_contract_frozen_execution_blocked
  - artifact_write_allowed is false
  - manifest_writer_allowed is false
  - checkpoint_creation_allowed is false
  - dataset_export_allowed is false
  - result_save remains at scaffold baseline with .gitkeep only
  - required manifest fields are explicit
  - no training model code reward weight calibration final tau selection or v5 migration occurs
rubric_items:
  - controlled_object_identified
  - desired_state_defined
  - state_variables_defined
  - sensors_defined
  - actuators_defined
  - feedback_loop_present
  - verification_plan_present
  - stability_risk_checked
  - observability_gap_checked
  - controllability_checked
  - disturbance_checked
  - decoupling_checked
  - reliability_or_error_control_checked
  - persistent_learning_update_suggested
pass_threshold: 85
minimum_required_items:
  - desired_state_defined
  - sensors_defined
  - verification_plan_present
  - reliability_or_error_control_checked
negative_checks:
  - artifact writer manifest writer dataset export or checkpoint writer is introduced
  - result_save receives new files beyond .gitkeep
  - artifact paths may escape result_save
  - training execution is allowed by the contract
  - actor critic model checkpoint or optimizer code is introduced
  - scalarization weights are selected or calibrated
  - final tau lower than 0.9 is selected or recommended
  - old v5 artifact roots replay columns reward formulas aliases phase scripts or P_eff names are introduced
source_awareness_required: true
rule_basis:
  - EC-RULE-001
  - EC-RULE-004
  - EC-RULE-008
  - EC-RULE-010
  - EC-RULE-028
  - EC-RULE-029
  - EC-RULE-034
relevant_lessons:
  - L001_metric_governance_first
  - L002_effective_success_alias_risk
  - L009_dec_pomdp_boundary_before_actor
  - L010_training_after_oracle_baseline_contracts
  - L011_debug_hypotheses_need_status
required_tests:
  - Stage 5.9 document exists and states no artifact write
  - structured artifact contract blocks artifact writes checkpoints dataset export and training
  - required manifest fields are explicit
  - artifact root is result_save and path escape is forbidden
  - result_save contains only .gitkeep
  - replay script prints the Stage 5.9 contract
  - project state recommends Stage 5.10 manifest validator implementation only
  - source scan rejects training model v5 and legacy metric terms
forbidden_v5_inheritance:
  - old artifact roots or phase output directories
  - old replay columns or phase CSV fields
  - old effective-success metric aliases
  - old reward formulas weights penalties or sentinel constants
  - old actor or critic checkpoint loading
expected_outputs:
  - design-only run manifest artifact contract
  - required manifest field list
  - blocked artifact write list
  - recommended Stage 5.10 run manifest validator implementation task
  - owner decision required marker
