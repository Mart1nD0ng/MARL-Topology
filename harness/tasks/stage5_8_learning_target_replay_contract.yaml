id: stage5_8_learning_target_replay_contract
name: Stage 5.8 Learning Target And Replay Contract Without Implementation
task_type: project_improvement
prompt: >
  Freeze a design-only learning target and replay contract after Stage 5.7.
  The task must define future return advantage value-target trajectory discount
  actor-batch centralized-view and training-diagnostic replay fields while
  keeping them planned not active. It must not write datasets, implement replay
  buffers, build learner batches, run training, add model code, calibrate
  weights, select final tau, or migrate v5 code.
required_artifacts:
  - design-only learning target replay contract manifest
  - replay script for Stage 5.8 contract report
  - Stage 5.8 learning target replay contract document
  - durable learning target replay contract document
  - replay Dec-POMDP metric training and project-state updates
  - unit tests for structured replay contract behavior
  - contract tests for Stage 5.8 boundary
  - post-task self-review report
expected_evidence:
  - verdict is learning_target_replay_contract_frozen_implementation_blocked
  - dataset_writer_allowed is false
  - replay_buffer_allowed is false
  - learner_batch_allowed is false
  - planned target columns are explicit but not active
  - return advantage and value-target remain rejected by active replay schema
  - planned columns are not actor inputs
  - no training model code reward weight calibration final tau selection or v5 migration occurs
rubric_items:
  - controlled_object_identified
  - desired_state_defined
  - state_variables_defined
  - sensors_defined
  - actuators_defined
  - feedback_loop_present
  - verification_plan_present
  - stability_risk_checked
  - observability_gap_checked
  - controllability_checked
  - disturbance_checked
  - decoupling_checked
  - reliability_or_error_control_checked
  - persistent_learning_update_suggested
pass_threshold: 85
minimum_required_items:
  - desired_state_defined
  - sensors_defined
  - verification_plan_present
  - reliability_or_error_control_checked
negative_checks:
  - dataset writer replay buffer or learner batch is introduced
  - return advantage or value-target columns become active without implementation approval
  - planned target columns enter deployment actor inputs
  - training execution is allowed by the contract
  - actor critic model checkpoint or optimizer code is introduced
  - scalarization weights are selected or calibrated
  - final tau lower than 0.9 is selected or recommended
  - old v5 replay columns reward formulas aliases phase scripts or P_eff names are introduced
source_awareness_required: true
rule_basis:
  - EC-RULE-001
  - EC-RULE-004
  - EC-RULE-008
  - EC-RULE-010
  - EC-RULE-028
  - EC-RULE-029
  - EC-RULE-034
relevant_lessons:
  - L001_metric_governance_first
  - L002_effective_success_alias_risk
  - L009_dec_pomdp_boundary_before_actor
  - L010_training_after_oracle_baseline_contracts
  - L011_debug_hypotheses_need_status
required_tests:
  - Stage 5.8 document exists and states no replay implementation
  - structured replay contract blocks dataset writer replay buffer learner batch and training
  - planned learning target columns are explicit
  - active replay validation still rejects return advantage and value-target
  - planned columns are not actor inputs
  - replay script prints the Stage 5.8 contract
  - project state recommends Stage 5.9 run manifest artifact contract only
  - source scan rejects training model v5 and legacy metric terms
forbidden_v5_inheritance:
  - old replay columns or phase CSV fields
  - old effective-success metric aliases
  - old reward formulas weights penalties or sentinel constants
  - old actor or critic checkpoint loading
  - old full-graph actor tensors
  - old oracle labels as actor inputs
expected_outputs:
  - design-only learning target replay contract
  - planned target column list
  - blocked implementation list
  - recommended Stage 5.9 run manifest artifact contract task
  - owner decision required marker
