id: stage5_0i_feasibility_envelope_sweep_design
name: Stage 5.0i Feasibility Envelope Sweep Design
task_type: project_improvement
prompt: >
  Design the feasibility envelope sweep around tau_requirement_min = 0.9.
  The design must define controlled sweep axes, row schema, comparison policy,
  acceptance sensors, and negative controls without executing sweeps, lowering
  tau, implementing reward, training, adding actor/critic code, or migrating
  v5 code.
required_artifacts:
  - executable Stage 5.0i sweep-design manifest builder
  - replay script for the design manifest
  - Stage 5.0i design documentation
  - project state update
  - contract and unit tests
  - post-task self-review report
expected_evidence:
  - tau_requirement_min is fixed at 0.9 during all future sweeps
  - required sweep axes cover bandwidth tx power deadline payload RSU placement resource orthogonalization fault filter and topology candidate expansion
  - each sweep varies one control family at a time
  - future sweep row schema includes reliability latency energy diagnostics and actor leakage guards
  - lower diagnostic tau values are not sweep thresholds
  - final tau selection remains unset
  - full graph remains baseline not oracle
  - reward training model and v5 migration remain blocked
rubric_items:
  - controlled_object_identified
  - desired_state_defined
  - state_variables_defined
  - sensors_defined
  - actuators_defined
  - feedback_loop_present
  - verification_plan_present
  - stability_risk_checked
  - observability_gap_checked
  - controllability_checked
  - disturbance_checked
  - decoupling_checked
  - reliability_or_error_control_checked
  - persistent_learning_update_suggested
pass_threshold: 85
minimum_required_items:
  - desired_state_defined
  - sensors_defined
  - verification_plan_present
  - reliability_or_error_control_checked
negative_checks:
  - final tau lower than 0.9 is selected or recommended
  - lower diagnostic tau values are treated as sweep thresholds
  - simulation parameters are changed to force feasibility
  - sweep design omits bandwidth tx power deadline payload RSU placement resource orthogonalization fault filter or topology expansion
  - reward implementation reward weights training actor critic COMA GNN LSTM or v5 code is introduced
  - full graph is treated as oracle or resource optimum
  - oracle or sweep labels are exposed as deployment actor inputs
  - unregistered metrics or legacy P_eff aliases enter the sweep schema
source_awareness_required: true
rule_basis:
  - EC-RULE-001
  - EC-RULE-004
  - EC-RULE-008
  - EC-RULE-010
  - EC-RULE-028
  - EC-RULE-029
  - EC-RULE-034
relevant_lessons:
  - L001_metric_governance_first
  - L002_effective_success_alias_risk
  - L003_full_mask_not_oracle
  - L004_reliability_plateau_before_resource_objective
  - L005_oracle_before_infeasible_claims
  - L010_training_after_oracle_baseline_contracts
  - L012_physics_can_mask_learning_claims
required_tests:
  - sweep design manifest records tau_requirement_min 0.9 and no final tau selection
  - all required sweep ids are present
  - each sweep axis has controlled parameter unit target failure reasons affected families expected signal monotonicity and output schema
  - row schema includes required metric and diagnostic fields
  - metric-valued fields map to registered metric concepts only
  - replay script prints Stage 5.0i design JSON without running sweeps
  - docs and project state record Stage 5.0i completion and next recommended executable sweep
  - no reward training actor critic COMA GNN LSTM or v5 code is introduced
forbidden_v5_inheritance:
  - old reward formulas weights penalties or sentinel constants
  - old effective-success metric aliases
  - old phase scripts as sweep implementation
  - full-mask optimality assumptions
  - fixed 0.5 deployment threshold defaults
  - actor global-info or oracle-label leakage
expected_outputs:
  - feasibility envelope sweep design manifest
  - future sweep row schema and comparison policy
  - acceptance sensors and negative controls
  - tests and harness validation evidence
  - residual risk list for future minimal executable sweep
