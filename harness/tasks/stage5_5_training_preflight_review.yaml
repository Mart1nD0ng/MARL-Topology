id: stage5_5_training_preflight_review
name: Stage 5.5 Training Preflight Review Without Training
task_type: project_improvement
prompt: >
  Review whether the project is ready for training execution after Stage 5.4
  report integration. The task must produce a structured preflight report with
  pass blocked and deferred gates, recommend only a future training design
  contract, and must not train, add model code, calibrate weights, select final
  tau, or migrate v5 code.
required_artifacts:
  - training preflight report builder
  - replay script for Stage 5.5 report
  - Stage 5.5 training preflight document
  - reward surrogate metric Dec-POMDP replay and project-state updates
  - unit tests for preflight report behavior
  - contract tests for Stage 5.5 boundary
  - post-task self-review report
expected_evidence:
  - verdict is not_ready_for_training_execution
  - training_execution_allowed is false
  - training_design_contract_allowed is true
  - blocking gates are visible
  - Stage 5.4 component-only report is consumed as source evidence
  - no training model code reward weight calibration final tau selection or v5 migration occurs
rubric_items:
  - controlled_object_identified
  - desired_state_defined
  - state_variables_defined
  - sensors_defined
  - actuators_defined
  - feedback_loop_present
  - verification_plan_present
  - stability_risk_checked
  - observability_gap_checked
  - controllability_checked
  - disturbance_checked
  - decoupling_checked
  - reliability_or_error_control_checked
  - persistent_learning_update_suggested
pass_threshold: 85
minimum_required_items:
  - desired_state_defined
  - sensors_defined
  - verification_plan_present
  - reliability_or_error_control_checked
negative_checks:
  - training execution is allowed by the preflight report
  - scalar surrogate is reported as evaluation success evidence
  - reward weights are calibrated selected or presented as final
  - actor critic COMA GNN LSTM optimizer or checkpoint code is introduced
  - return advantage or value-target columns are admitted without a future contract
  - final tau lower than 0.9 is selected or recommended
  - old v5 reward formulas weights aliases phase scripts or P_eff names are introduced
  - surrogate diagnostics enter deployment actor inputs
source_awareness_required: true
rule_basis:
  - EC-RULE-001
  - EC-RULE-004
  - EC-RULE-008
  - EC-RULE-010
  - EC-RULE-028
  - EC-RULE-029
  - EC-RULE-034
relevant_lessons:
  - L001_metric_governance_first
  - L002_effective_success_alias_risk
  - L004_reliability_plateau_before_resource_objective
  - L009_dec_pomdp_boundary_before_actor
  - L010_training_after_oracle_baseline_contracts
  - L011_debug_hypotheses_need_status
required_tests:
  - Stage 5.5 document exists and states no training execution
  - preflight report verdict blocks training execution
  - preflight report exposes pass blocked and deferred gates
  - replay script prints the Stage 5.5 report
  - project state recommends Stage 5.6 design contract only
  - source scan rejects training model v5 and legacy metric terms
forbidden_v5_inheritance:
  - old reward formulas weights penalties or sentinel constants
  - old effective-success metric aliases
  - old phase scripts as training entry points
  - full-mask optimality assumptions
  - fixed 0.5 deployment threshold defaults
  - actor global-info or oracle-label leakage
expected_outputs:
  - structured preflight report
  - blocked gate list for training execution
  - recommended Stage 5.6 training design contract task
  - owner decision required marker
