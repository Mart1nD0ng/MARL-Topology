id: stage24_critic_integrated_mappo_micro_loop
name: Stage 24 Critic-Integrated MAPPO Micro-Loop
task_type: project_improvement
prompt: >
  Implement and run a complete small-scale critic-integrated MAPPO-style
  micro-loop for the selected physical-link action semantics, repair endpoint
  sampler exact proposal-logprob semantics, re-compare endpoint and
  Plackett-Luce samplers fairly, and close with exactly one active sampler.
controlled_object: >
  Selected-physical CTDE policy-gradient training surface: rollout collector,
  centralized critic value baseline, GAE returns/advantages, clipped actor
  objective, critic value loss, stochastic sampler registry, and Stage 24
  closeout state.
desired_state: >
  Actor-safe decentralized observations produce physical-link proposal logits;
  stochastic proposal actions are sampled with tractable proposal logprobs;
  the environment-side physical-link assembler projects proposals into selected
  topology; centralized critic values are used for advantages and value loss;
  Plackett-Luce and repaired endpoint samplers are compared under the same
  micro-loop; exactly one active sampler remains after closeout.
complete_mappo_loop_requirement: >
  Stage 24 must include rollout collection, centralized critic value
  predictions, GAE or equivalent returns/advantages, clipped actor loss,
  critic value loss, entropy diagnostics, approximate KL, clip fraction,
  gradient norm, actor update, critic update, and before/after sampler
  comparison. Smoke-only execution cannot decide the winner.
centralized_critic_required: >
  The critic must be training-only, receive centralized critic input through a
  separate view, produce values used in advantage computation, and receive
  gradient through value loss. Actor input must not receive critic fields.
sampler_logprob_repair_requirement: >
  The endpoint sampler must record exact endpoint proposal logprob for the
  endpoint action A={S_i}; it must not claim exact probability for the final
  projected topology. If repair fails, endpoint cannot be promoted.
rollout_batch_size_requirements: >
  Smoke mode uses 4 scenarios x 4 steps, minibatch size 8, 2 epochs, and one
  policy update. Micro mode uses 8 scenarios x 8 steps, minibatch size 16, at
  least 2 epochs, and at least 32 transitions; only micro mode can close the
  stage.
reward_no_weight_change_rule: >
  Use the existing Stage 5 surrogate configuration and selected normalization
  references. Do not tune, add, remove, rename, or calibrate reward weights;
  keep tau_requirement_min at 0.9 and do not select final tau.
pass_fail_gate: >
  PASS requires endpoint repair or explicit rejection, fair sampler comparison,
  centralized critic used in advantages, GAE or equivalent advantages,
  clipped actor loss, value loss, actor and critic gradients, unchanged reward
  config, no actor leakage, no COMA or Transformer, no scale-up, no checkpoint,
  exactly one active sampler, and passing validation.
post_task_self_review_requirement: >
  Closeout must answer critic use, GAE status, rollout/minibatch validity,
  sampler winner, endpoint exact logprob status, policy effect, KL/entropy/clip
  safety, projection mismatch, reward-weight status, and Stage 25 readiness.
required_artifacts:
  - src/marl_topology/training/mappo/rollout.py
  - src/marl_topology/training/mappo/advantages.py
  - src/marl_topology/training/mappo/losses.py
  - src/marl_topology/training/mappo/trainer.py
  - src/marl_topology/training/policy_gradient/samplers.py
  - scripts/train/stage24_mappo_micro_loop.py
  - docs/STAGE24_CRITIC_INTEGRATED_MAPPO_MICRO_LOOP.md
  - docs/STAGE24_ENDPOINT_SAMPLER_LOGPROB_REPAIR.md
  - docs/STAGE24_MAPPO_SAMPLER_RECOMPARISON.md
  - docs/STAGE24_MAPPO_MICRO_LOOP_RESULTS.md
  - harness/reports/post_task_self_review_stage24.md
  - docs/PROJECT_STATE.md
expected_evidence:
  - Preflight confirms undirected_physical_link_v1 remains active
  - Preflight confirms directed_outgoing_v1 is not active
  - Preflight confirms Plackett-Luce was the active sampler before Stage 24
  - Endpoint sampler is repaired as archived comparison candidate
  - Centralized critic is available and training-only
  - Rollout batch records actor-safe observation and centralized critic input separately
  - GAE returns and advantages are finite and mask terminal transitions
  - Clipped actor loss and critic value loss are finite
  - Actor and critic parameters change in smoke and micro mode
  - Reward config fingerprint is unchanged before and after the run
  - Active sampler registry contains exactly one sampler after closeout
  - Tests, harness validation, smoke script, and micro script pass
negative_checks:
  - Actor input receives centralized critic input consensus_success_probability latency energy reward surrogate oracle label global topology or future outcome
  - Endpoint sampler claims exact projected-topology logprob
  - Sampler uses objective metrics reward latency energy or oracle labels to sample
  - Reward weights are tuned added renamed or calibrated
  - COMA Transformer new GNN GRU LSTM scale-up training final tau selection checkpoint or v5 migration occurs
  - Smoke mode is used for sampler winner decision
  - Fewer than two stochastic samplers are compared without blocker report
  - More than one active policy-gradient sampler remains after closeout
  - Pilot writes uncontrolled checkpoints datasets or unmanifested result_save artifacts
