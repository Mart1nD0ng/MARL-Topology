id: v5_asset_audit
name: V5 Asset Audit
task_type: project_analysis
prompt: >
  Inspect v5 as read-only legacy reference, classify candidate assets, and update the migration ledger
  with proposed action, evidence, tests, semantic risks, owner decision, and status.
required_artifacts:
  - v5 candidate inventory
  - migration ledger update
  - required test list
  - semantic risk notes
expected_evidence:
  - read-only file references
  - contract mapping
  - no writes under v5
  - rejection or deferral reasons
rubric_items:
  - controlled_object_identified
  - desired_state_defined
  - sensors_defined
  - actuators_defined
  - feedback_loop_present
  - verification_plan_present
  - stability_risk_checked
  - controllability_checked
  - disturbance_checked
  - decoupling_checked
  - reliability_or_error_control_checked
  - persistent_learning_update_suggested
pass_threshold: 80
minimum_required_items:
  - desired_state_defined
  - sensors_defined
  - verification_plan_present
negative_checks:
  - modifies v5
  - copies legacy reward
  - migrates model code without contract tests
source_awareness_required: true
rule_basis:
  - EC-RULE-001
  - EC-RULE-004
  - EC-RULE-007
  - EC-RULE-013
  - EC-RULE-034

