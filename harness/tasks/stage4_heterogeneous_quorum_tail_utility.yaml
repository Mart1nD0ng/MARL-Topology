id: stage4_heterogeneous_quorum_tail_utility
name: Stage 4.1 Heterogeneous Quorum-Tail Utility
task_type: code_review
prompt: >
  Review the Stage 4.1 heterogeneous quorum-tail utility. Confirm it evaluates
  at-least-k success probability for heterogeneous Bernoulli inputs with a
  coefficient evaluator, covers boundary and monotonicity tests, avoids subset
  enumeration, random sampling, Monte Carlo simulation, v5 imports, reward,
  training, and PBFT three-phase implementation.
required_artifacts:
  - Stage 4.1 quorum-tail utility module
  - Stage 4.1 utility documentation
  - unit tests for boundary hand-formula monotonicity and filtering behavior
  - protocol contract update
  - project state update
  - post-task self-review report
expected_evidence:
  - heterogeneous_quorum_tail returns correct boundary values
  - homogeneous and heterogeneous small cases match hand formulas
  - probability is monotonic in each input
  - conservative filtering removes largest probabilities and is no larger than unfiltered
  - source scan rejects subset enumeration random sampling Monte Carlo v5 imports and torch
  - no PBFT cascade reward training actor critic or Stage 3 adapter is added
rubric_items:
  - controlled_object_identified
  - desired_state_defined
  - state_variables_defined
  - sensors_defined
  - actuators_defined
  - feedback_loop_present
  - verification_plan_present
  - stability_risk_checked
  - observability_gap_checked
  - controllability_checked
  - disturbance_checked
  - decoupling_checked
  - reliability_or_error_control_checked
  - persistent_learning_update_suggested
pass_threshold: 85
minimum_required_items:
  - desired_state_defined
  - sensors_defined
  - verification_plan_present
  - reliability_or_error_control_checked
negative_checks:
  - utility enumerates all success subsets
  - utility uses random sampling Monte Carlo learned prediction or torch dependency
  - utility imports or copies v5 consensus code
  - utility introduces reward timeout latency energy or new metric names
  - utility implements PBFT pre-prepare prepare commit cascade
  - full graph oracle training actor critic COMA GNN or LSTM logic appears
source_awareness_required: true
rule_basis:
  - EC-RULE-001
  - EC-RULE-004
  - EC-RULE-008
  - EC-RULE-010
  - EC-RULE-028
  - EC-RULE-029
  - EC-RULE-034
relevant_lessons:
  - L001_metric_governance_first
  - L002_effective_success_alias_risk
  - L008_phase_script_entropy
  - L010_training_after_oracle_baseline_contracts
required_tests:
  - quorum tail boundary cases
  - homogeneous and heterogeneous hand formulas
  - monotonicity in each probability
  - invalid input rejection
  - conservative byzantine filtering behavior
  - source scan for no sampling no subset enumeration no v5 imports
forbidden_v5_inheritance:
  - v5 consensus implementation
  - old metric aliases and mode taxonomy
  - old reward shaping
  - phase scripts
  - torch autograd or training-oriented utility defaults
expected_outputs:
  - standalone quorum-tail utility
  - tests and documentation
  - residual risks and Stage 4.2 recommendation
