id: protocol_timeout_review_stage2_8
name: Stage 2.8 Protocol Timeout Review
task_type: code_review
prompt: >
  Review the Stage 2 minimal quorum graph protocol boundary. Confirm quorum,
  deadline, timeout, consensus success, consensus probability, latency, reward,
  and diagnostics remain separate before reward, replay writing, full PBFT, or
  training work.
required_artifacts:
  - Stage 2.8 protocol timeout review document
  - PROTOCOL_CONTRACT update
  - project state update
  - quorum and deadline boundary tests
expected_evidence:
  - active protocol variant is stage2_minimal_quorum_graph
  - deadline equality passes and deadline exceedance fails consensus_success
  - consensus_success_probability is not timeout-gated
  - timeout quorum reward and P_eff names are not introduced as metrics
  - no full PBFT simulator training reward or v5 protocol code is added
rubric_items:
  - controlled_object_identified
  - desired_state_defined
  - state_variables_defined
  - sensors_defined
  - actuators_defined
  - feedback_loop_present
  - verification_plan_present
  - stability_risk_checked
  - observability_gap_checked
  - controllability_checked
  - disturbance_checked
  - decoupling_checked
  - reliability_or_error_control_checked
  - persistent_learning_update_suggested
pass_threshold: 85
minimum_required_items:
  - desired_state_defined
  - sensors_defined
  - verification_plan_present
negative_checks:
  - timeout quorum or deadline is introduced as a standalone reward term
  - timeout quorum or deadline is introduced as an unregistered metric
  - P_eff soft hard legacy or effective-success taxonomy is copied from v5
  - consensus_success_probability is silently timeout-gated
  - full PBFT message simulator view-change adversary or stochastic timeout code is added
  - actor critic COMA GNN LSTM training reward or v5 phase-script code is added
source_awareness_required: true
rule_basis:
  - EC-RULE-001
  - EC-RULE-004
  - EC-RULE-008
  - EC-RULE-010
  - EC-RULE-028
  - EC-RULE-029
  - EC-RULE-034
relevant_lessons:
  - L001_metric_governance_first
  - L002_effective_success_alias_risk
  - L004_reliability_plateau_before_resource_objective
  - L010_training_after_oracle_baseline_contracts
required_tests:
  - ConsensusConfig rejects invalid quorum threshold and negative deadline
  - TopologyEvaluator rejects quorum larger than node count
  - deadline equality passes
  - deadline exceedance reports deadline_exceeded
  - consensus_success_probability remains separate from timeout gate
  - metric rows contain only registered metrics
forbidden_v5_inheritance:
  - old P_succ or P_eff naming
  - hard soft legacy effective-success modes
  - deadline or quorum factors folded into unregistered metrics
  - timeout or quorum reward terms
  - phase scripts as protocol implementation
expected_outputs:
  - protocol timeout review document
  - updated protocol contract boundary
  - tests and harness validation evidence
  - residual risk list for future full PBFT protocol work
