id: stage4_7_pbft_application_evaluation_report
name: Stage 4.7 PBFT Application Evaluation Report
task_type: code_review
prompt: >
  Review the Stage 4.7 PBFT application evaluation report. Confirm it combines
  Stage 4.5 baseline/oracle-candidate outputs and Stage 4.6 protocol accounting
  diagnostics, reports only registered metric concepts, keeps reliability
  feasibility separate from latency and energy views, preserves full graph and
  oracle boundaries, and avoids reward, training, actor critic code, and v5
  migration.
required_artifacts:
  - Stage 4.7 application evaluation report module
  - Stage 4.7 report documentation
  - replay helper that prints the report only
  - unit tests for report structure metric governance and boundary checks
  - contract tests for documentation harness state exports and forbidden routes
  - protocol and metric contract updates
  - project state update
  - post-task self-review report
expected_evidence:
  - report source stage is Stage 4.5
  - metric rows are registered and no new metric names are introduced
  - reliability feasibility depends only on consensus_success_probability threshold
  - lowest feasible latency and energy views are selected from feasible rows
  - Stage 4.6 protocol accounting diagnostics are present
  - full graph remains baseline and not oracle
  - oracle-candidate labels are not deployment actor inputs
  - source scan rejects v5 reward training actor critic and old metric aliases
rubric_items:
  - controlled_object_identified
  - desired_state_defined
  - state_variables_defined
  - sensors_defined
  - actuators_defined
  - feedback_loop_present
  - verification_plan_present
  - stability_risk_checked
  - observability_gap_checked
  - controllability_checked
  - disturbance_checked
  - decoupling_checked
  - reliability_or_error_control_checked
  - persistent_learning_update_suggested
pass_threshold: 85
minimum_required_items:
  - desired_state_defined
  - sensors_defined
  - verification_plan_present
  - reliability_or_error_control_checked
negative_checks:
  - unregistered metric appears in report output
  - network delivery probability is renamed as consensus_success_probability
  - latency or energy view is treated as reward or training target
  - full graph is labelled oracle
  - oracle-candidate labels are exposed as deployment actor inputs
  - reward training actor critic COMA GNN LSTM or v5 code is introduced
source_awareness_required: true
rule_basis:
  - EC-RULE-001
  - EC-RULE-004
  - EC-RULE-008
  - EC-RULE-010
  - EC-RULE-028
  - EC-RULE-029
  - EC-RULE-034
relevant_lessons:
  - L001_metric_governance_first
  - L002_effective_success_alias_risk
  - L003_full_mask_not_oracle
  - L005_oracle_before_infeasible_claims
  - L008_phase_script_entropy
  - L010_training_after_oracle_baseline_contracts
required_tests:
  - report combines Stage 4.5 and Stage 4.6 outputs
  - metric rows are registered
  - no new metric names are introduced
  - reliability feasibility is separate from latency and energy
  - full graph baseline not oracle
  - oracle-candidate not actor input
  - replay script is print-only
  - source scan for no v5 no reward no training no actor critic code
forbidden_v5_inheritance:
  - old P_succ or P_eff aliases
  - hard soft legacy effective-success modes
  - old reward shaping or timeout penalties
  - phase scripts
  - actor critic COMA MAPPO training code
  - any direct v5 import or copied route
expected_outputs:
  - Stage 4.7 PBFT application evaluation report helper
  - print-only replay helper
  - tests and documentation
  - residual risks and next-stage recommendation
