id: stage17_actor_observability_label_disambiguation
name: Stage 17 Actor Observability And Label Disambiguation
task_type: project_improvement
prompt: >
  Diagnose whether actor-safe local observations are sufficient to support
  current hard edge labels. Build actor observation signatures, group identical
  signatures, detect contradictory add/remove/keep and metric-delta labels,
  classify suspected causes, and recommend actor-safe feature, target, history,
  or critic-only fixes. Do not train, rerun Stage 11-15, implement models,
  introduce COMA/Transformer, tune reward weights, modify v5, create
  checkpoints, or write training artifacts.
required_artifacts:
  - Stage 17 actor-label disambiguation module in src
  - Stage 17 replay report script without artifact writes
  - Stage 17 documentation report
  - unit tests for synthetic contradiction detection and Stage 16 analysis
  - contract tests for docs harness state and forbidden implementation paths
  - PROJECT_STATE update marking Stage 17 complete if gates pass
  - post-task self-review report
expected_evidence:
  - actor observation signature uses only actor-safe fields
  - forbidden global oracle reward critic and future fields are rejected
  - contradiction clusters include observation summary affected agent edge sample count labels metric deltas scenario topology ids cause and fixes
  - cause taxonomy includes missing resource context missing neighbor/link context missing previous topology target global dependency hard soft/ranking oracle non-observable Dec-POMDP ambiguity target bug and unknown
  - Stage 16 data can be analyzed
  - Stage 11-15 rerun remains blocked unless contradiction rate is acceptably low
rubric_items:
  - controlled_object_identified
  - desired_state_defined
  - state_variables_defined
  - sensors_defined
  - actuators_defined
  - feedback_loop_present
  - verification_plan_present
  - stability_risk_checked
  - observability_gap_checked
  - controllability_checked
  - disturbance_checked
  - decoupling_checked
  - reliability_or_error_control_checked
  - persistent_learning_update_suggested
pass_threshold: 85
minimum_required_items:
  - controlled_object_identified
  - desired_state_defined
  - sensors_defined
  - verification_plan_present
  - decoupling_checked
  - reliability_or_error_control_checked
negative_checks:
  - training or PPO MAPPO execution is introduced
  - Stage 11-15 is rerun
  - new actor critic GNN recurrent COMA or Transformer model is implemented
  - reward weights or final tau are tuned
  - checkpoint creation loading or training artifact writing is added
  - v5 code is modified migrated or used as a template
  - actor signature includes global topology selected topology oracle reward consensus critic future or centralized fields
source_awareness_required: true
rule_basis:
  - EC-RULE-001
  - EC-RULE-004
  - EC-RULE-008
  - EC-RULE-010
  - EC-RULE-028
  - EC-RULE-029
  - EC-RULE-034
relevant_lessons:
  - L009_dec_pomdp_boundary_before_actor
  - L012_stage_sprawl_design_only_loop
  - L013_weak_exit_gate_patch_stage_cascade
  - L014_state_harness_self_review_drift
required_tests:
  - synthetic identical actor observation with conflicting labels produces a contradiction cluster
  - actor signature rejects forbidden fields
  - Stage 16 data analysis produces classified causes and blocks training rerun
  - report script prints JSON and writes no artifacts
  - docs project state and harness task are registered
forbidden_v5_inheritance:
  - v5 actor global tensors
  - v5 replay labels
  - v5 reward weights
  - v5 checkpoint or phase-script logic
expected_outputs:
  - Stage 17 contradiction cluster report
  - actor observability verdict
  - feature target history or critic-only repair recommendation
  - Stage 18 or owner feature-boundary recommendation
