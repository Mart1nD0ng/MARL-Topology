id: stage7_completion_learning_evidence_exit_gate
name: Stage 7 Completion Learning Evidence Dataset Build And Quality Exit Gate
task_type: project_improvement
prompt: >
  Complete Stage 7 as a learning evidence data layer before actor model design.
  Build scenario/topology evidence rows over a scenario set, generate oracle and
  heuristic topology labels, build add/remove/keep/swap edge-delta learning
  targets with training-only surrogate diagnostics, separate actor-safe,
  critic, target, and diagnostics views, run a data quality exit gate, and write
  an evidence-only artifact through the run manifest validator. Do not train,
  implement actor or critic model code, create checkpoints, calibrate weights,
  select final tau, or migrate v5 code.
required_artifacts:
  - Stage 7 completion plan and exit-gate document
  - Stage 7 completion dataset builder module
  - Stage 7 completion replay script
  - evidence-only artifact under result_save/evidence_dataset_only
  - unit tests for scenario topology evidence targets quality and artifact guard
  - contract tests for docs task project state script artifact and source boundaries
  - PROJECT_STATE update marking Stage 7 complete only after exit criteria pass
  - post-task self-review report
expected_evidence:
  - scenario topology evidence rows cover multiple scenarios and required topology variants
  - oracle or heuristic topology labels exist and are not actor inputs
  - add remove keep and swap edge-delta targets exist
  - surrogate diagnostics exist only as training targets or diagnostics
  - actor-safe critic target and diagnostics views are separated
  - class balance includes feasible and infeasible rows under tau 0.9
  - sparse-vs-full trade-off is visible
  - actor-observable predictability risk is reported
  - manifest-validated evidence artifact is written without checkpoint model or training logs
rubric_items:
  - controlled_object_identified
  - desired_state_defined
  - state_variables_defined
  - sensors_defined
  - actuators_defined
  - feedback_loop_present
  - verification_plan_present
  - stability_risk_checked
  - observability_gap_checked
  - controllability_checked
  - disturbance_checked
  - decoupling_checked
  - reliability_or_error_control_checked
  - persistent_learning_update_suggested
pass_threshold: 85
minimum_required_items:
  - desired_state_defined
  - sensors_defined
  - verification_plan_present
  - reliability_or_error_control_checked
negative_checks:
  - Stage 7 closes on smoke-only evidence
  - oracle labels enter actor_safe_view
  - reward surrogate diagnostics enter actor observations
  - swap edge target is omitted
  - class balance lacks feasible or infeasible rows
  - artifact writing bypasses run manifest validator
  - checkpoint model output training log or v5 path is written
  - actor critic COMA GNN LSTM implementation is introduced
source_awareness_required: true
rule_basis:
  - EC-RULE-001
  - EC-RULE-004
  - EC-RULE-008
  - EC-RULE-010
  - EC-RULE-028
  - EC-RULE-029
  - EC-RULE-034
relevant_lessons:
  - L001_metric_governance_first
  - L003_full_mask_not_oracle
  - L004_policy_failure_not_infeasible
  - L009_dec_pomdp_boundary_before_actor
  - L010_training_after_oracle_baseline_contracts
required_tests:
  - completion dataset has multiple scenarios and required topology variants
  - completion report satisfies all ten Stage 7 exit criteria
  - add remove keep and swap edge-delta targets exist
  - surrogate diagnostic target deltas are separated from actor_safe_view
  - oracle labels are diagnostics or targets only
  - sparse-vs-full trade-off exists
  - feasible and infeasible class balance exists under tau 0.9
  - artifact export writes only manifest evidence and quality report under result_save/evidence_dataset_only
  - source scan rejects training model checkpoint v5 and legacy metric terms
forbidden_v5_inheritance:
  - old phase report structure as project control logic
  - old reward formulas weights or shortcut labels
  - old metric aliases or effective-success naming
  - old actor critic checkpoint loading
  - old oracle labels as deployment actor inputs
expected_outputs:
  - Stage 7 completion dataset summary
  - Stage 7 exit criteria report
  - manifest-validated evidence artifact
  - Stage 8.0 actor policy interface contract recommendation
  - owner decision required marker
