id: review_dec_pomdp_env_wrapper
name: Review Minimal Dec-POMDP Env Wrapper
task_type: code_review
prompt: >
  Review MinimalDecPOMDPEnv reset/step behavior around the existing Scene3D,
  CandidateGraph, ActorObservation, EdgeActionDecision, JointTopologyAction,
  and TopologyEvaluator contracts. Confirm it does not implement training,
  reward, actor, critic, COMA, or complex physics.
required_artifacts:
  - reset output schema
  - step input output schema
  - actor-observation leakage check
  - topology evaluation boundary note
  - no-reward no-training statement
expected_evidence:
  - reset returns ActorObservation per node
  - step accepts EdgeActionDecision values only
  - non-candidate edge decisions fail
  - TopologyEvaluation is environment-side feedback not actor input
  - no actor critic COMA reward training or replay storage code added
rubric_items:
  - controlled_object_identified
  - desired_state_defined
  - state_variables_defined
  - sensors_defined
  - actuators_defined
  - feedback_loop_present
  - verification_plan_present
  - stability_risk_checked
  - controllability_checked
  - decoupling_checked
  - reliability_or_error_control_checked
  - persistent_learning_update_suggested
pass_threshold: 85
minimum_required_items:
  - desired_state_defined
  - sensors_defined
  - verification_plan_present
negative_checks:
  - reset returns global topology oracle labels or metrics to actor observations
  - step accepts non-candidate edges
  - wrapper computes reward or starts training
  - wrapper instantiates actor critic COMA GNN or LSTM code
source_awareness_required: true
rule_basis:
  - EC-RULE-001
  - EC-RULE-004
  - EC-RULE-008
  - EC-RULE-010
  - EC-RULE-034
relevant_lessons:
  - L005_oracle_before_infeasible_claims
  - L009_dec_pomdp_boundary_before_actor
  - L010_training_after_oracle_baseline_contracts
required_tests:
  - reset actor observations pass schema validation
  - step advances time and returns topology evaluation
  - step before reset fails
  - invalid edge decision fails
  - actor observations contain no evaluation metric fields
forbidden_v5_inheritance:
  - global graph tensors in deployment observations
  - oracle labels as actor inputs
  - reward or training loop
  - actor critic COMA GNN LSTM or checkpoint loading
expected_outputs:
  - review verdict
  - reset step evidence
  - leakage risks and deferred gates
