id: stage5_0m_objective_readiness_review
name: Stage 5.0m Objective Readiness Review Before Reward Implementation
task_type: project_improvement
prompt: >
  Review whether Stage 5.0 objective contracts and feasibility evidence are
  sufficient to permit Stage 5.1 as a reward implementation plan without code.
  The task must compose Stage 5.0h, Stage 5.0j, Stage 5.0k, and Stage 5.0l
  evidence, keep tau_requirement_min = 0.9 fixed, and keep final tau
  selection, reward code, reward weights, training, model code, and v5
  migration blocked.
required_artifacts:
  - executable Stage 5.0m objective-readiness report builder
  - replay script for the Stage 5.0m report
  - Stage 5.0m documentation
  - objective and reward-surrogate contract notes
  - project state update
  - contract and unit tests
  - post-task self-review report
expected_evidence:
  - readiness report composes Stage 5.0h Stage 5.0j Stage 5.0k and Stage 5.0l evidence
  - tau_requirement_min remains 0.9
  - Stage 5.1 is allowed only as reward implementation plan without code
  - reward code reward weights training model work final tau selection and v5 migration remain blocked
  - Stage 3-backed sweep evidence is present
  - metric governance introduces no new metric names
  - full graph remains baseline not oracle
  - oracle and sweep labels remain outside deployment actor inputs
rubric_items:
  - controlled_object_identified
  - desired_state_defined
  - state_variables_defined
  - sensors_defined
  - actuators_defined
  - feedback_loop_present
  - verification_plan_present
  - stability_risk_checked
  - observability_gap_checked
  - controllability_checked
  - disturbance_checked
  - decoupling_checked
  - reliability_or_error_control_checked
  - persistent_learning_update_suggested
pass_threshold: 85
minimum_required_items:
  - desired_state_defined
  - sensors_defined
  - verification_plan_present
  - reliability_or_error_control_checked
negative_checks:
  - Stage 5.1 is treated as permission to implement reward code
  - final tau lower than 0.9 is selected or recommended
  - reward implementation reward weights training actor critic COMA GNN LSTM or v5 code is introduced
  - full graph is treated as oracle or resource optimum
  - oracle or sweep labels are exposed as deployment actor inputs
  - unregistered metrics or legacy P_eff aliases enter the readiness schema
  - conservative fault filter is described as a strict Byzantine model
source_awareness_required: true
rule_basis:
  - EC-RULE-001
  - EC-RULE-004
  - EC-RULE-008
  - EC-RULE-010
  - EC-RULE-028
  - EC-RULE-029
  - EC-RULE-034
relevant_lessons:
  - L001_metric_governance_first
  - L002_effective_success_alias_risk
  - L003_full_mask_not_oracle
  - L004_reliability_plateau_before_resource_objective
  - L005_oracle_before_infeasible_claims
  - L010_training_after_oracle_baseline_contracts
  - L012_physics_can_mask_learning_claims
required_tests:
  - Stage 5.0m builder returns fixed tau 0.9 and no final tau selection
  - readiness gates all pass for Stage 5.1 plan-only scope
  - reward code reward weights training model work and v5 migration remain blocked
  - Stage 3-backed evidence from Stage 5.0k and Stage 5.0l is included
  - replay script prints Stage 5.0m JSON
  - project state marks Stage 5.0m complete and recommends Stage 5.1 plan-only
  - no reward training actor critic COMA GNN LSTM or v5 code is introduced
forbidden_v5_inheritance:
  - old reward formulas weights penalties or sentinel constants
  - old effective-success metric aliases
  - old phase scripts as reward implementation
  - full-mask optimality assumptions
  - fixed 0.5 deployment threshold defaults
  - actor global-info or oracle-label leakage
expected_outputs:
  - Stage 5.0m objective readiness report
  - Stage 5.1 plan-only go/no-go decision
  - blocked work list for reward code training model work and v5 migration
  - residual risk list for Stage 5.1 planning
