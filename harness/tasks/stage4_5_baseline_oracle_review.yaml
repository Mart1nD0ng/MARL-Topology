id: stage4_5_baseline_oracle_review
name: Stage 4.5 Baseline And Oracle-Candidate Review
task_type: code_review
prompt: >
  Review the Stage 4.5 baseline and oracle-candidate evaluation sensor. Confirm
  it compares empty sparse and full topology baselines through Stage 3
  communication records and Stage 4 expected-initiator PBFT reliability, keeps
  full graph as a baseline rather than an oracle, preserves the distinction
  between baseline failure and infeasibility, uses only registered metrics, and
  avoids reward, training, actor critic model code, and v5 migration.
required_artifacts:
  - Stage 4.5 baseline and oracle-candidate review module
  - Stage 4.5 review documentation
  - unit tests for baselines oracle-candidate and metric registration
  - contract tests for documentation harness state and forbidden routes
  - protocol and metric contract updates
  - project state update
  - post-task self-review report
expected_evidence:
  - empty baseline fails while a feasible oracle-candidate exists
  - full graph is baseline and not oracle-candidate
  - oracle-candidate is not deployment actor input
  - reliability feasibility is checked against consensus_success_probability threshold
  - latency and energy are reported separately from reliability feasibility
  - metric rows are registered
  - source scan rejects v5 reward training actor critic and old metric aliases
rubric_items:
  - controlled_object_identified
  - desired_state_defined
  - state_variables_defined
  - sensors_defined
  - actuators_defined
  - feedback_loop_present
  - verification_plan_present
  - stability_risk_checked
  - observability_gap_checked
  - controllability_checked
  - disturbance_checked
  - decoupling_checked
  - reliability_or_error_control_checked
  - persistent_learning_update_suggested
pass_threshold: 85
minimum_required_items:
  - desired_state_defined
  - sensors_defined
  - verification_plan_present
  - reliability_or_error_control_checked
negative_checks:
  - full graph is labelled oracle
  - failed baseline is reported as proof of infeasibility
  - oracle-candidate labels are exposed as deployment actor inputs
  - network_delivery_probability is directly exported as consensus_success_probability
  - latency or energy is hidden inside a reward or effective-success alias
  - reward training actor critic COMA GNN LSTM or v5 code is introduced
source_awareness_required: true
rule_basis:
  - EC-RULE-001
  - EC-RULE-004
  - EC-RULE-008
  - EC-RULE-010
  - EC-RULE-028
  - EC-RULE-029
  - EC-RULE-034
relevant_lessons:
  - L001_metric_governance_first
  - L002_effective_success_alias_risk
  - L003_full_mask_not_oracle
  - L005_oracle_before_infeasible_claims
  - L008_phase_script_entropy
  - L010_training_after_oracle_baseline_contracts
required_tests:
  - baseline rows for empty sparse and full topologies
  - empty failure does not imply infeasible when oracle-candidate is feasible
  - full graph baseline not oracle-candidate
  - oracle-candidate not actor input
  - reliability threshold separate from latency and energy
  - metric rows registered
  - source scan for no v5 no reward no training no actor critic code
forbidden_v5_inheritance:
  - v5 phase34 or phase36 topology audit scripts
  - old P_succ or P_eff aliases
  - hard soft legacy effective-success modes
  - old reward shaping or protocol penalties
  - phase scripts
  - torch autograd or training-oriented evaluation code
expected_outputs:
  - Stage 4.5 baseline and oracle-candidate review report helper
  - tests and documentation
  - residual risks and next-stage recommendation
