id: stage5_0h_requirement_feasibility_diagnosis
name: Stage 5.0h Requirement-Anchored Feasibility Diagnosis
task_type: project_improvement
prompt: >
  Diagnose Stage 5.0f alpha fixture feasibility against tau_requirement_min =
  0.9 as a real requirement baseline. Classify infeasible rows by reason,
  audit parameter realism, and propose feasibility envelope sweeps without
  lowering final tau, implementing reward, training, adding actor/critic code,
  or migrating v5 code.
required_artifacts:
  - executable Stage 5.0h requirement feasibility diagnosis report builder
  - replay script for the diagnosis report
  - Stage 5.0h diagnosis documentation
  - objective contract update for tau_requirement_min baseline
  - project state update
  - contract and unit tests
  - post-task self-review report
expected_evidence:
  - tau_requirement_min is recorded as 0.9 and is not derived from alpha calibration
  - objective feasibility direction is consensus_success_probability >= tau_requirement_min
  - tau_stress_candidates and tau_diagnostic_values are separated from final selection
  - all infeasible rows have supported failure reasons
  - family-level dominant failure reasons are present
  - topology-level failure reasons are present
  - parameter sanity table covers communication protocol topology and PBFT controls
  - feasibility envelope plan includes bandwidth power deadline payload RSU placement resource orthogonalization fault filter and topology expansion
  - final tau below 0.9 is not selected
rubric_items:
  - controlled_object_identified
  - desired_state_defined
  - state_variables_defined
  - sensors_defined
  - actuators_defined
  - feedback_loop_present
  - verification_plan_present
  - stability_risk_checked
  - observability_gap_checked
  - controllability_checked
  - disturbance_checked
  - decoupling_checked
  - reliability_or_error_control_checked
  - persistent_learning_update_suggested
pass_threshold: 85
minimum_required_items:
  - desired_state_defined
  - sensors_defined
  - verification_plan_present
  - reliability_or_error_control_checked
negative_checks:
  - final tau lower than 0.9 is selected or recommended
  - lower diagnostic tau values are treated as final candidates
  - Stage 4.8 diagnostic threshold or Stage 5.0g candidate language is treated as final tau
  - simulation parameters are changed to force feasibility
  - reward implementation reward weights training actor critic COMA GNN LSTM or v5 code is introduced
  - full graph is treated as oracle or resource optimum
  - oracle-candidate labels are exposed as deployment actor inputs
  - unregistered metrics or legacy P_eff aliases enter the report schema
source_awareness_required: true
rule_basis:
  - EC-RULE-001
  - EC-RULE-004
  - EC-RULE-008
  - EC-RULE-010
  - EC-RULE-028
  - EC-RULE-029
  - EC-RULE-034
relevant_lessons:
  - L001_metric_governance_first
  - L002_effective_success_alias_risk
  - L003_full_mask_not_oracle
  - L004_reliability_plateau_before_resource_objective
  - L005_oracle_before_infeasible_claims
  - L010_training_after_oracle_baseline_contracts
  - L012_physics_can_mask_learning_claims
required_tests:
  - diagnosis builder records tau_requirement_min 0.9 and no final tau selection
  - all infeasible rows receive supported failure_reason values
  - family summaries include dominant_failure_reason values
  - parameter sanity table covers required controls and allowed status values
  - envelope plan includes required sweeps and blocked changes
  - documentation answers feasibility diagnosis questions
  - replay script prints Stage 5.0h JSON
  - no reward training actor critic COMA GNN LSTM or v5 code is introduced
forbidden_v5_inheritance:
  - old reward formulas weights penalties or sentinel constants
  - old effective-success metric aliases
  - old phase scripts as diagnosis or sweep implementation
  - full-mask optimality assumptions
  - fixed 0.5 deployment threshold defaults
  - actor global-info or oracle-label leakage
expected_outputs:
  - requirement-anchored feasibility diagnosis report
  - row family and topology-level failure classification
  - parameter sanity table and feasibility envelope plan
  - tests and harness validation evidence
  - residual risk list for future Stage 3-backed envelope sweep
