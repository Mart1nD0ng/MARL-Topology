id: stage6_1_actor_safe_batch_builder_and_exit_gate
name: Stage 6.1 Actor-Safe Batch Builder And Stage 6 Exit Gate
task_type: project_improvement
prompt: >
  Implement an in-memory actor-safe batch builder that consumes ActorObservation
  values or replay-schema-projected mixed rows and emits only deployment actor
  fields. Then close Stage 6. The task must not write datasets, write artifacts,
  create checkpoints, run training, implement actor critic model code,
  calibrate weights, select final tau, or migrate v5 code.
required_artifacts:
  - actor-safe batch builder module
  - replay script for Stage 6.1 actor-safe batch report
  - Stage 6.1 actor-safe batch document
  - Stage 6 completion review document
  - training metric Dec-POMDP and project-state updates
  - unit tests for actor-safe batch acceptance and rejection behavior
  - contract tests for Stage 6.1 boundaries and Stage 6 closure
  - post-task self-review report
expected_evidence:
  - ActorObservation batch contains only deployment actor fields
  - mixed rows project to actor-safe fields and drop centralized evaluation diagnostics
  - missing actor fields are rejected
  - direct extra actor fields are rejected
  - unsupported future learning-target columns are rejected
  - duplicate agent time rows are rejected
  - result_save remains at scaffold baseline with .gitkeep only
  - Stage 6 is closed and Stage 7 requires owner approval
rubric_items:
  - controlled_object_identified
  - desired_state_defined
  - state_variables_defined
  - sensors_defined
  - actuators_defined
  - feedback_loop_present
  - verification_plan_present
  - stability_risk_checked
  - observability_gap_checked
  - controllability_checked
  - disturbance_checked
  - decoupling_checked
  - reliability_or_error_control_checked
  - persistent_learning_update_suggested
pass_threshold: 85
minimum_required_items:
  - desired_state_defined
  - sensors_defined
  - verification_plan_present
  - reliability_or_error_control_checked
negative_checks:
  - actor batch contains centralized training fields oracle labels metrics surrogate diagnostics future outcomes or action labels
  - actor batch writer or dataset export is introduced
  - model checkpoint optimizer or training execution is introduced
  - result_save receives new files beyond .gitkeep
  - reward weights or final tau are selected
  - Stage 6 remains open for more planning after the exit gate
  - old v5 artifact roots replay columns reward formulas aliases phase scripts or P_eff names are introduced
source_awareness_required: true
rule_basis:
  - EC-RULE-001
  - EC-RULE-004
  - EC-RULE-008
  - EC-RULE-010
  - EC-RULE-028
  - EC-RULE-029
  - EC-RULE-034
relevant_lessons:
  - L001_metric_governance_first
  - L009_dec_pomdp_boundary_before_actor
  - L010_training_after_oracle_baseline_contracts
  - L011_debug_hypotheses_need_status
required_tests:
  - actor-safe batch from observations passes
  - mixed-row projection excludes centralized evaluation reward and action fields
  - missing actor fields fail
  - direct extra actor fields fail
  - unsupported target columns fail
  - duplicate agent time rows fail
  - replay script prints Stage 6.1 batch report
  - project state marks Stage 6 closed and recommends Stage 7
  - result_save contains only .gitkeep
  - source scan rejects training model v5 and legacy metric terms
forbidden_v5_inheritance:
  - old artifact roots or phase output directories
  - old replay columns or phase CSV fields
  - old effective-success metric aliases
  - old reward formulas weights penalties or sentinel constants
  - old actor or critic checkpoint loading
expected_outputs:
  - in-memory actor-safe batch summary
  - Stage 6 completion marker
  - recommended Stage 7 owner-approved next task
  - owner decision required marker
