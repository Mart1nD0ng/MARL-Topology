id: stage3_geometry_visibility_review
name: Stage 3.1 Geometry Visibility Review
task_type: code_review
prompt: >
  Review Stage 3.1 geometry and visibility implementation for 3D city objects,
  ray-box intersection, LoS/NLoS classification, blocker records, urban gaps,
  and RSU height effects before channel simulation is implemented.
required_artifacts:
  - geometry3d implementation
  - geometry fixture definitions
  - ray-box and LoS tests
  - blocker record tests
expected_evidence:
  - 3D distance is correct
  - blocker ids are stable
  - building height can change LoS state
  - urban gap can preserve LoS corridor
  - RSU height can restore LoS
rubric_items:
  - controlled_object_identified
  - desired_state_defined
  - state_variables_defined
  - sensors_defined
  - actuators_defined
  - feedback_loop_present
  - verification_plan_present
  - stability_risk_checked
  - observability_gap_checked
  - controllability_checked
  - disturbance_checked
  - decoupling_checked
  - reliability_or_error_control_checked
pass_threshold: 85
minimum_required_items:
  - desired_state_defined
  - sensors_defined
  - verification_plan_present
negative_checks:
  - 2D shortcut is hidden behind 3D interface
  - geometry implementation computes channel SINR or reward
  - blocker records are missing scenario or building ids
  - PBFT consensus success or reliability is introduced
  - v5 geometry or phase-script code is copied
source_awareness_required: true
rule_basis:
  - EC-RULE-001
  - EC-RULE-004
  - EC-RULE-008
  - EC-RULE-010
relevant_lessons:
  - L012_physics_can_mask_learning_claims
required_tests:
  - free_space_close geometry
  - blocked_by_building geometry
  - urban_gap_los geometry
  - urban_canyon_nlos geometry
  - rsu_high_los geometry
forbidden_v5_inheritance:
  - old phase scripts
  - old channel shortcuts
  - old metric aliases
expected_outputs:
  - geometry records and tests
  - no channel or PBFT implementation
  - updated residual risks
