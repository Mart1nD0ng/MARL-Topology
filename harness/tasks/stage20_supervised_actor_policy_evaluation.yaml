id: stage20_supervised_actor_policy_evaluation
name: Stage 20 Supervised Actor Policy Evaluation With Environment Assembler
task_type: project_improvement
prompt: >
  Evaluate Stage 19 supervised actor edge scores through the Stage 8
  environment-side ConflictAwareGreedyAssembler and registered topology
  evaluator. Compare MLP, GNN, GRU real multi-step subset, and LSTM after GRU
  sanity against full graph, greedy reliability, source topology, and oracle
  diagnostic baselines. Do not run PPO/MAPPO, COMA, Transformer, critic rerun,
  scale-up training, reward-weight tuning, final tau selection, checkpoint
  creation, training artifact writes, or v5 modification.
required_artifacts:
  - Stage 20 evaluation module in src
  - Stage 20 report script that prints JSON and writes no artifact
  - Stage 20 policy evaluation document
  - unit tests for assembler-backed supervised actor policy evaluation
  - contract tests for docs harness state and boundary checks
  - PROJECT_STATE update marking Stage 20 complete if gates pass
  - post-task self-review report
expected_evidence:
  - Stage 19 actor scores are converted to EdgeScoreRecord outputs
  - ConflictAwareGreedyAssembler produces selected topology
  - assembler rejection reasons are recorded
  - topology evaluator reports consensus_success_probability latency energy and topology diagnostics
  - full graph is a baseline and not an oracle
  - oracle is diagnostic only and never actor input
  - policy-gradient readiness gate is based on assembler-projected metrics
  - PPO MAPPO COMA Transformer checkpoint artifact reward tuning final tau and v5 paths remain blocked
rubric_items:
  - controlled_object_identified
  - desired_state_defined
  - state_variables_defined
  - sensors_defined
  - actuators_defined
  - feedback_loop_present
  - verification_plan_present
  - stability_risk_checked
  - observability_gap_checked
  - controllability_checked
  - disturbance_checked
  - decoupling_checked
  - reliability_or_error_control_checked
  - persistent_learning_update_suggested
pass_threshold: 85
minimum_required_items:
  - controlled_object_identified
  - desired_state_defined
  - sensors_defined
  - verification_plan_present
  - observability_gap_checked
  - decoupling_checked
  - reliability_or_error_control_checked
negative_checks:
  - PPO MAPPO or policy-gradient update is introduced
  - COMA or Transformer implementation is introduced
  - critic training is rerun during Stage 20
  - checkpoint creation loading or training artifact writing is added
  - reward weights or final tau are tuned
  - v5 code is modified migrated or used as a template
  - oracle labels global topology consensus reward latency energy future outcome or critic targets enter actor inputs
  - deployment assembler consumes objective oracle reward consensus latency or energy metrics
source_awareness_required: true
rule_basis:
  - EC-RULE-001
  - EC-RULE-004
  - EC-RULE-008
  - EC-RULE-010
  - EC-RULE-028
  - EC-RULE-029
  - EC-RULE-034
relevant_lessons:
  - L009_dec_pomdp_boundary_before_actor
  - L010_training_after_oracle_baseline_contracts
  - L013_weak_exit_gate_patch_stage_cascade
  - L014_state_harness_self_review_drift
required_tests:
  - Stage 20 report uses environment-side assembler
  - actor outputs remain edge scores not final topology
  - assembler diagnostics include rejection reasons
  - baseline full graph is not oracle
  - oracle diagnostic is not actor input
  - policy-gradient readiness remains blocked when assembler metrics lag greedy baseline
  - Stage 20 script writes no checkpoint or artifact
forbidden_v5_inheritance:
  - v5 fixed threshold deployment
  - v5 actor global tensors
  - v5 phase scripts
  - v5 reward weights
  - v5 checkpoint logic
expected_outputs:
  - Stage 20 assembler-backed supervised actor policy evaluation report
  - Stage 21 assembler-aware supervised target refinement recommendation
