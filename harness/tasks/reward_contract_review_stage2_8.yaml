id: reward_contract_review_stage2_8
name: Stage 2.8 Reward Contract Review
task_type: code_review
prompt: >
  Review the reward contract boundary before any reward implementation. Confirm
  reliability remains a constraint, latency and energy remain objectives,
  diagnostics remain diagnostics, actor observations remain local, and no v5
  reward, metric alias, training surrogate, or reward code is introduced.
required_artifacts:
  - Stage 2.8 reward contract review document
  - REWARD_CONTRACT update
  - project state update
  - contract tests for no reward implementation and no metric drift
expected_evidence:
  - no active reward function exists
  - no reward weights or training surrogate are registered
  - only registered metrics are used for evaluation evidence
  - reliability threshold must be declared by future reward proposals
  - timeout quorum full graph edge count and topology diagnostics are not standalone reward terms
  - actor observations and deployment actor columns exclude reward oracle and evaluation metric labels
rubric_items:
  - controlled_object_identified
  - desired_state_defined
  - state_variables_defined
  - sensors_defined
  - actuators_defined
  - feedback_loop_present
  - verification_plan_present
  - stability_risk_checked
  - observability_gap_checked
  - controllability_checked
  - disturbance_checked
  - decoupling_checked
  - reliability_or_error_control_checked
  - persistent_learning_update_suggested
pass_threshold: 85
minimum_required_items:
  - desired_state_defined
  - sensors_defined
  - verification_plan_present
negative_checks:
  - old v5 reward formula weights penalties sentinel constants or phase scripts are copied
  - P_eff soft hard legacy or derived reliability aliases are reintroduced without metric registration
  - timeout quorum full graph edge count density sparsity or mask retention becomes standalone reward
  - shaped reward improvement is reported without registered metric evidence
  - reward oracle labels future outcomes or evaluation metrics enter ActorObservation or deployment actor columns
  - actor critic COMA GNN LSTM training or reward implementation code is added
source_awareness_required: true
rule_basis:
  - EC-RULE-001
  - EC-RULE-004
  - EC-RULE-008
  - EC-RULE-010
  - EC-RULE-028
  - EC-RULE-029
  - EC-RULE-034
relevant_lessons:
  - L001_metric_governance_first
  - L002_effective_success_alias_risk
  - L003_full_mask_not_oracle
  - L004_reliability_plateau_before_resource_objective
  - L006_fixed_threshold_deployment_risk
  - L009_dec_pomdp_boundary_before_actor
  - L010_training_after_oracle_baseline_contracts
  - L012_physics_can_mask_learning_claims
required_tests:
  - reward review doc states no active reward function and no training surrogate
  - REWARD_CONTRACT keeps reliability as constraint and latency energy as objectives
  - no P_eff soft hard defaults are reintroduced
  - no reward implementation or training code is added under src
  - project state marks Stage 2.8 complete and owner decision required
forbidden_v5_inheritance:
  - old reward formulas weights penalties or sentinel constants
  - old effective-success metric aliases
  - old phase scripts as reward implementation
  - full-mask optimality assumptions
  - fixed 0.5 deployment threshold defaults
  - actor global-info or oracle-label leakage
expected_outputs:
  - reward contract review document
  - updated reward contract boundary
  - tests and harness validation evidence
  - residual risk list for future reward implementation
