id: stage4_6_protocol_accounting_review
name: Stage 4.6 Protocol Latency And Energy Accounting Review
task_type: code_review
prompt: >
  Review the Stage 4.6 PBFT protocol latency and energy accounting layer.
  Confirm it consumes Stage 3 network communication records grouped by PBFT
  phase, reports registered latency and energy concepts only, keeps accounting
  separate from consensus probability and reward, integrates with Stage 4.5
  baseline/oracle-candidate review, and avoids v5 code or training/model work.
required_artifacts:
  - Stage 4.6 protocol accounting module
  - Stage 4.6 documentation
  - unit tests for phase latency energy accounting and forbidden routes
  - contract tests for documentation harness state and exports
  - protocol and metric contract updates
  - Stage 4.5 integration note
  - project state update
  - post-task self-review report
expected_evidence:
  - protocol latency is sum of phase-max latency clipped to phase budgets
  - protocol energy is sum of scheduled Stage 3 network attempt energy
  - late records consume clipped phase budget and keep scheduled energy visible
  - accounting does not export consensus probability
  - accounting does not implement reward
  - metric rows use only registered latency energy and topology_diagnostics names
  - Stage 4.5 baseline/oracle review uses Stage 4.6 accounting diagnostics
  - source scan rejects v5 reward training actor critic and old metric aliases
rubric_items:
  - controlled_object_identified
  - desired_state_defined
  - state_variables_defined
  - sensors_defined
  - actuators_defined
  - feedback_loop_present
  - verification_plan_present
  - stability_risk_checked
  - observability_gap_checked
  - controllability_checked
  - disturbance_checked
  - decoupling_checked
  - reliability_or_error_control_checked
  - persistent_learning_update_suggested
pass_threshold: 85
minimum_required_items:
  - desired_state_defined
  - sensors_defined
  - verification_plan_present
  - decoupling_checked
negative_checks:
  - accounting output is reported as consensus probability
  - network delivery probability is renamed as consensus_success_probability
  - late or failed communication is forced to zero protocol cost
  - latency or energy is hidden inside reward or effective-success aliases
  - full graph is labelled oracle
  - reward training actor critic COMA GNN LSTM or v5 code is introduced
source_awareness_required: true
rule_basis:
  - EC-RULE-001
  - EC-RULE-004
  - EC-RULE-008
  - EC-RULE-010
  - EC-RULE-028
  - EC-RULE-029
  - EC-RULE-034
relevant_lessons:
  - L001_metric_governance_first
  - L002_effective_success_alias_risk
  - L003_full_mask_not_oracle
  - L008_phase_script_entropy
  - L010_training_after_oracle_baseline_contracts
required_tests:
  - phase latency is max scheduled latency clipped to phase budget
  - phase energy is scheduled attempt energy sum
  - late records increment deadline-filtered counts
  - zero-delivery records are diagnostics not consensus probability
  - metric rows are registered
  - Stage 4.5 uses Stage 4.6 accounting
  - source scan for no v5 no reward no training no actor critic code
forbidden_v5_inheritance:
  - old P_succ or P_eff aliases
  - hard soft legacy effective-success modes
  - old reward shaping or timeout penalties
  - phase scripts
  - actor critic COMA MAPPO training code
  - any direct v5 import or copied route
expected_outputs:
  - Stage 4.6 protocol accounting helper
  - updated Stage 4.5 latency and energy aggregation diagnostics
  - tests and documentation
  - residual risks and next-stage recommendation
