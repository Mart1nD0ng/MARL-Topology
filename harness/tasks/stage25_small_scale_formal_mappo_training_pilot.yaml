id: stage25_small_scale_formal_mappo_training_pilot
name: Stage 25 Small-Scale Formal MAPPO Training Pilot
task_type: project_improvement
prompt: >
  Run a fixed-protocol small-scale formal MAPPO training pilot for the selected
  physical-link stack, compare MAPPO fine-tuning against the supervised GNN
  baseline on a train/eval split, generate visualization and reward-surface
  reports, and close with scale-up blocked pending owner decision.
controlled_object: >
  Stage 25 selected-physical MAPPO training surface: local message-passing GNN
  actor, centralized training-only critic, Plackett-Luce physical-link sampler,
  selected physical-link assembler, Stage 3/4 objective evaluator, frozen Stage
  5 reward surrogate, manifest-approved reporting artifacts, and project state.
desired_state: >
  The fixed stage25_pilot_base_config executes without boundary violation;
  at least two seeds complete; MAPPO is evaluated against the supervised GNN,
  greedy, full, and teacher baselines on eval slots; reliability does not
  materially degrade; at least one objective or projection/reward metric
  improves; visualization and reward-surface diagnostics are generated; torch
  import hygiene is clean; and scale-up remains blocked.
fixed_protocol_requirement: >
  Use train_scenarios=16, eval_scenarios=8, seeds=3, rollout_steps=16,
  transitions_per_update=256, minibatch_size=64, update_epochs=4,
  max_updates=20, eval_every=5, gamma=0.99, gae_lambda=0.95, clip_eps=0.2,
  actor_lr=1e-4, critic_lr=1e-4, entropy_coef=0.01, value_coef=0.5, and
  max_grad_norm=0.5. Do not tune these values during Stage 25.
pass_fail_gate: >
  PASS requires base protocol execution, train/eval split, at least two
  completed seeds, supervised GNN comparison, eval tau-feasible degradation no
  worse than 0.05 absolute, eval violation-rate increase no worse than 0.05
  absolute, at least one latency/energy/projection-rejection/surrogate reward
  improvement, unchanged reward weights, visualization report generation, code
  hygiene cleanup, no forbidden model or sampler changes, no v5 modification,
  and passing tests plus harness validation.
post_task_self_review_requirement: >
  Closeout must answer whether MAPPO improved supervised GNN on eval, likely
  root cause if not, fixed rollout and batch size status, diagnostic probe
  status, reward-surface alignment status, visualization artifact status,
  dynamic torch import cleanup status, scale-up authorization status, LSTM
  block status, and the recommended Stage 26.
required_artifacts:
  - docs/STAGE25_BASE_TRAINING_PROTOCOL.md
  - docs/STAGE25_SMALL_SCALE_MAPPO_TRAINING_PILOT.md
  - docs/STAGE25_REWARD_SURFACE_AND_OBJECTIVE_ALIGNMENT.md
  - docs/STAGE25_TRAINING_VISUALIZATION_REPORT.md
  - scripts/train/stage25_small_scale_mappo_training_pilot.py
  - scripts/replay/stage25_training_visualization_report.py
  - src/marl_topology/training/mappo/stage25_pilot.py
  - src/marl_topology/evaluation/reward_surface_analysis.py
  - tests/unit/test_stage25_base_training_protocol.py
  - tests/unit/test_stage25_reward_surface_analysis.py
  - tests/contract/test_stage25_no_dynamic_torch_import.py
  - tests/contract/test_stage25_training_boundaries.py
  - tests/contract/test_stage25_visualization_outputs.py
  - harness/reports/post_task_self_review_stage25.md
  - docs/PROJECT_STATE.md
expected_evidence:
  - Preflight confirms Stage 24 complete and active sampler is Plackett-Luce
  - Fixed base config validates transitions_per_update, minibatch, epochs, eval cadence, and seed count
  - Reward config fingerprint is unchanged before and after the pilot
  - Run manifest validator accepts the report artifact root and performs no dry-run writes
  - Train/eval split is recorded and used for formal comparison
  - At least two seeds complete under the fixed protocol
  - MAPPO fine-tuned actor is compared with supervised GNN baseline on eval slots
  - Eval reliability degradation and violation-rate increase stay within 0.05 absolute
  - At least one latency energy projection rejection or surrogate reward metric improves on eval
  - Reward-surface analysis passes required objective-alignment checks without weight tuning
  - Visualization report creates manifest-approved CSV and plot artifacts
  - Source scan finds no dynamic torch imports and direct torch imports only in model/training modules
  - No COMA Transformer GRU/LSTM recurrent PPO reward tuning final tau sampler switch checkpoint scale-up v5 modification or uncontrolled artifact write occurs
negative_checks:
  - Hyperparameters are changed based on Stage 25 performance or a diagnostic probe is used as the main result
  - Active sampler is switched away from physical_plackett_luce_top_k_sampler
  - Reward weights tau requirement final tau or reward surrogate weights are changed
  - Actor inputs receive centralized critic fields objective metrics oracle labels global topology future outcome or reward surrogate values
  - COMA Transformer GRU LSTM recurrent PPO sampler switching scale-up training checkpoint creation or v5 migration occurs
  - Training report writes artifacts outside the manifest-approved result_save root
  - Stage 24 smoke or micro-loop metrics are presented as formal Stage 25 comparison metrics
rubric_items:
  - controlled_object_identified
  - desired_state_defined
  - state_variables_defined
  - sensors_defined
  - actuators_defined
  - feedback_loop_present
  - verification_plan_present
  - stability_risk_checked
  - observability_gap_checked
  - controllability_checked
  - disturbance_checked
  - delay_or_async_risk_checked
  - noise_or_flakiness_checked
  - decoupling_checked
  - reliability_or_error_control_checked
  - persistent_learning_update_suggested
pass_threshold: 90
minimum_required_items:
  - controlled_object_identified
  - desired_state_defined
  - state_variables_defined
  - sensors_defined
  - verification_plan_present
  - observability_gap_checked
  - decoupling_checked
  - reliability_or_error_control_checked
source_awareness_required: true
rule_basis:
  - EC-RULE-001
  - EC-RULE-004
  - EC-RULE-008
  - EC-RULE-010
  - EC-RULE-028
  - EC-RULE-029
  - EC-RULE-034
expected_outputs:
  - Stage 25 fixed base training protocol
  - Stage 25 small-scale MAPPO training pilot report
  - Stage 25 reward surface and objective alignment report
  - Stage 25 visualization report
  - Stage 25 post-task self-review
