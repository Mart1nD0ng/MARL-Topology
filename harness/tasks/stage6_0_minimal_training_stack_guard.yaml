id: stage6_0_minimal_training_stack_guard
name: Stage 6.0 Minimal Training Stack With Manifest Guard
task_type: project_improvement
prompt: >
  Implement the first Stage 6 minimal training-stack guard. The stack must
  consume the Stage 5.10 run manifest validator, check owner approval and
  required contract markers, reject blocked operations, and emit a dry-run
  readiness report. It must not write artifacts, write manifests, export
  datasets, create checkpoints, run training, implement actor critic model
  code, calibrate weights, select final tau, or migrate v5 code.
required_artifacts:
  - minimal training stack guard module
  - replay script for Stage 6.0 guard report
  - Stage 6.0 training stack guard document
  - training metric Dec-POMDP and project-state updates
  - unit tests for guard acceptance and rejection behavior
  - contract tests for Stage 6.0 boundaries
  - post-task self-review report
expected_evidence:
  - valid owner-approved dry-run manifest produces stack_ready true
  - missing owner approval blocks readiness
  - missing contract marker blocks readiness
  - Stage 5.10 manifest validator blocks invalid manifests
  - blocked operation requests are rejected
  - result_save remains at scaffold baseline with .gitkeep only
  - no training model code artifact writer dataset export checkpoint final tau selection or v5 migration occurs
rubric_items:
  - controlled_object_identified
  - desired_state_defined
  - state_variables_defined
  - sensors_defined
  - actuators_defined
  - feedback_loop_present
  - verification_plan_present
  - stability_risk_checked
  - observability_gap_checked
  - controllability_checked
  - disturbance_checked
  - decoupling_checked
  - reliability_or_error_control_checked
  - persistent_learning_update_suggested
pass_threshold: 85
minimum_required_items:
  - desired_state_defined
  - sensors_defined
  - verification_plan_present
  - reliability_or_error_control_checked
negative_checks:
  - Stage 6.0 bypasses the Stage 5.10 manifest validator
  - missing owner approval is accepted
  - missing contract markers are accepted
  - artifact writer manifest writer dataset export checkpoint writer or training execution is introduced
  - actor critic model checkpoint loader or optimizer code is introduced
  - result_save receives new files beyond .gitkeep
  - reward weights or final tau are selected
  - old v5 artifact roots replay columns reward formulas aliases phase scripts or P_eff names are introduced
source_awareness_required: true
rule_basis:
  - EC-RULE-001
  - EC-RULE-004
  - EC-RULE-008
  - EC-RULE-010
  - EC-RULE-028
  - EC-RULE-029
  - EC-RULE-034
relevant_lessons:
  - L001_metric_governance_first
  - L009_dec_pomdp_boundary_before_actor
  - L010_training_after_oracle_baseline_contracts
  - L011_debug_hypotheses_need_status
required_tests:
  - valid owner-approved manifest produces stack_ready true
  - missing owner approval blocks stack readiness
  - missing contract marker blocks stack readiness
  - invalid manifest blocks stack readiness through Stage 5.10 validator
  - blocked operation requests are rejected
  - replay script prints Stage 6.0 guard report
  - result_save contains only .gitkeep
  - source scan rejects training model v5 and legacy metric terms
forbidden_v5_inheritance:
  - old artifact roots or phase output directories
  - old replay columns or phase CSV fields
  - old effective-success metric aliases
  - old reward formulas weights penalties or sentinel constants
  - old actor or critic checkpoint loading
expected_outputs:
  - minimal stack readiness report
  - blocked operation diagnostics
  - recommended Stage 6.1 actor-safe batch builder task
  - owner decision required marker
