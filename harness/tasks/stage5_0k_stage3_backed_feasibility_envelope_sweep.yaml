id: stage5_0k_stage3_backed_feasibility_envelope_sweep
name: Stage 5.0k Stage 3-Backed Feasibility Envelope Sweep Hardening
task_type: project_improvement
prompt: >
  Harden the Stage 5.0j alpha feasibility envelope sweep by grounding a minimal
  subset of controls in Stage 3 communication records. The task must hold
  tau_requirement_min = 0.9 fixed, produce Stage 3-backed sweep rows, and keep
  final tau selection, reward, training, model code, and v5 migration blocked.
required_artifacts:
  - executable Stage 5.0k Stage 3-backed sweep report builder
  - replay script for the Stage 3-backed sweep report
  - Stage 5.0k documentation
  - project state update
  - contract and unit tests
  - post-task self-review report
expected_evidence:
  - executed sweeps include bandwidth deadline and resource orthogonalization
  - every row has tau_requirement_min 0.9
  - every row is backed by Stage 3 network records
  - every row uses urlcc_finite_blocklength_v1 link records
  - message matrices are built through the Stage 4.3 adapter
  - latency and energy are accounted from Stage 4.6 protocol accounting
  - at least one Stage 3-backed infeasible-to-feasible transition exists
  - shared-resource rows expose interference groups
  - orthogonal-resource rows remove interference groups
  - full graph remains baseline not oracle
  - final tau selection remains unset
  - reward training model and v5 migration remain blocked
rubric_items:
  - controlled_object_identified
  - desired_state_defined
  - state_variables_defined
  - sensors_defined
  - actuators_defined
  - feedback_loop_present
  - verification_plan_present
  - stability_risk_checked
  - observability_gap_checked
  - controllability_checked
  - disturbance_checked
  - decoupling_checked
  - reliability_or_error_control_checked
  - persistent_learning_update_suggested
pass_threshold: 85
minimum_required_items:
  - desired_state_defined
  - sensors_defined
  - verification_plan_present
  - reliability_or_error_control_checked
negative_checks:
  - final tau lower than 0.9 is selected or recommended
  - lower diagnostic tau values are treated as sweep thresholds
  - reward implementation reward weights training actor critic COMA GNN LSTM or v5 code is introduced
  - Monte Carlo sampling or subset enumeration is used for PBFT reliability
  - full graph is treated as oracle or resource optimum
  - oracle or sweep labels are exposed as deployment actor inputs
  - unregistered metrics or legacy P_eff aliases enter the sweep schema
  - Stage 5.0j alpha probabilities are used without Stage 3 records for hardened rows
source_awareness_required: true
rule_basis:
  - EC-RULE-001
  - EC-RULE-004
  - EC-RULE-008
  - EC-RULE-010
  - EC-RULE-028
  - EC-RULE-029
  - EC-RULE-034
relevant_lessons:
  - L001_metric_governance_first
  - L002_effective_success_alias_risk
  - L003_full_mask_not_oracle
  - L004_reliability_plateau_before_resource_objective
  - L005_oracle_before_infeasible_claims
  - L010_training_after_oracle_baseline_contracts
  - L012_physics_can_mask_learning_claims
required_tests:
  - Stage 5.0k builder returns fixed tau 0.9 and no final tau selection
  - executed Stage 3-backed sweep ids are bandwidth deadline and resource orthogonalization
  - rows contain required schema fields and valid probability latency energy ranges
  - rows use Stage 3 network records and urlcc_finite_blocklength_v1
  - Stage 4.3 adapter and Stage 4.6 accounting are used
  - Stage 3-backed infeasible-to-feasible transitions are present
  - shared-resource rows have interference groups and orthogonal rows do not
  - replay script prints Stage 5.0k JSON
  - no reward training actor critic COMA GNN LSTM or v5 code is introduced
forbidden_v5_inheritance:
  - old reward formulas weights penalties or sentinel constants
  - old effective-success metric aliases
  - old phase scripts as sweep implementation
  - full-mask optimality assumptions
  - fixed 0.5 deployment threshold defaults
  - actor global-info or oracle-label leakage
expected_outputs:
  - Stage 3-backed feasibility envelope sweep report
  - sweep rows and summary evidence
  - tests and harness validation evidence
  - residual risk list for future sweep range expansion and realism review
