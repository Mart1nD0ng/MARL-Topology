id: stage5_6_training_design_contract
name: Stage 5.6 Training Design Contract Without Execution
task_type: project_improvement
prompt: >
  Freeze a design-only training contract after Stage 5.5 preflight. The task
  must define training purpose scalarization policy learning targets replay
  boundaries architecture boundaries scenario and seed protocol baselines
  diagnostics stop conditions and artifact policy. It must not run training add
  model code calibrate weights select final tau or migrate v5 code.
required_artifacts:
  - design-only training contract manifest
  - replay script for Stage 5.6 contract report
  - Stage 5.6 training design contract document
  - reward surrogate metric Dec-POMDP replay and project-state updates
  - unit tests for structured contract behavior
  - contract tests for Stage 5.6 boundary
  - post-task self-review report
expected_evidence:
  - verdict is design_contract_frozen_training_execution_blocked
  - training_execution_allowed is false
  - scalarization policy exists with no selected weights
  - future learning-target columns are planned not active
  - deployment actor boundary is unchanged
  - scenario seed baseline artifact and stop-condition requirements are explicit
  - no training model code reward weight calibration final tau selection or v5 migration occurs
rubric_items:
  - controlled_object_identified
  - desired_state_defined
  - state_variables_defined
  - sensors_defined
  - actuators_defined
  - feedback_loop_present
  - verification_plan_present
  - stability_risk_checked
  - observability_gap_checked
  - controllability_checked
  - disturbance_checked
  - decoupling_checked
  - reliability_or_error_control_checked
  - persistent_learning_update_suggested
pass_threshold: 85
minimum_required_items:
  - desired_state_defined
  - sensors_defined
  - verification_plan_present
  - reliability_or_error_control_checked
negative_checks:
  - training execution is allowed by the contract
  - scalarization weights are selected or calibrated
  - actor critic COMA GNN LSTM optimizer checkpoint or learner code is introduced
  - return advantage or value-target columns are admitted as active data columns
  - final tau lower than 0.9 is selected or recommended
  - old v5 reward formulas weights aliases phase scripts or P_eff names are introduced
  - surrogate diagnostics or oracle labels enter deployment actor inputs
source_awareness_required: true
rule_basis:
  - EC-RULE-001
  - EC-RULE-004
  - EC-RULE-008
  - EC-RULE-010
  - EC-RULE-028
  - EC-RULE-029
  - EC-RULE-034
relevant_lessons:
  - L001_metric_governance_first
  - L002_effective_success_alias_risk
  - L004_reliability_plateau_before_resource_objective
  - L009_dec_pomdp_boundary_before_actor
  - L010_training_after_oracle_baseline_contracts
  - L011_debug_hypotheses_need_status
required_tests:
  - Stage 5.6 document exists and states no training execution
  - structured contract blocks training execution
  - scalarization policy has no selected weights
  - future learning-target columns are planned not active
  - replay script prints the Stage 5.6 contract
  - project state recommends Stage 5.7 architecture contract only
  - source scan rejects training model v5 and legacy metric terms
forbidden_v5_inheritance:
  - old reward formulas weights penalties or sentinel constants
  - old effective-success metric aliases
  - old phase scripts as training entry points
  - full-mask optimality assumptions
  - fixed 0.5 deployment threshold defaults
  - actor global-info or oracle-label leakage
expected_outputs:
  - design-only training contract
  - blocked execution list
  - recommended Stage 5.7 policy architecture contract task
  - owner decision required marker
