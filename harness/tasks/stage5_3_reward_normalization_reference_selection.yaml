id: stage5_3_reward_normalization_reference_selection
name: Stage 5.3 Reward Normalization Reference Selection
task_type: project_improvement
prompt: >
  Select fixed latency and energy normalization references for the Stage 5.2
  reward-surrogate interface from approved Stage 3-backed evidence. The
  selection must be deterministic, auditable, and separate from reward weight
  calibration. It must not train, add model code, select final tau, or migrate
  v5 code.
required_artifacts:
  - normalization reference selector
  - Stage 5.3 reference-selection report builder
  - replay script for reference-selection report
  - Stage 5.3 reference-selection document
  - reward and surrogate contract updates
  - metric contract update
  - project state update
  - unit tests for selector behavior
  - contract tests for Stage 5.3 boundary
  - post-task self-review report
expected_evidence:
  - source evidence is Stage 5.0l Stage 3-backed range review
  - selection policy is feasible_positive_max_v1
  - latency and energy references are positive finite values
  - eligible and excluded row counts are reported
  - selected references can populate the Stage 5.2 surrogate config
  - reward weights are not calibrated or selected
  - no training model code final tau selection or v5 migration occurs
rubric_items:
  - controlled_object_identified
  - desired_state_defined
  - state_variables_defined
  - sensors_defined
  - actuators_defined
  - feedback_loop_present
  - verification_plan_present
  - stability_risk_checked
  - observability_gap_checked
  - controllability_checked
  - disturbance_checked
  - decoupling_checked
  - reliability_or_error_control_checked
  - persistent_learning_update_suggested
pass_threshold: 85
minimum_required_items:
  - desired_state_defined
  - sensors_defined
  - verification_plan_present
  - reliability_or_error_control_checked
negative_checks:
  - reward weights are calibrated selected or presented as final
  - training actor critic COMA GNN LSTM or model code is introduced
  - final tau lower than 0.9 is selected or recommended
  - old v5 reward formulas weights aliases phase scripts or P_eff names are introduced
  - normalization references are derived from v5 or Stage 4.8 smoke rows by default
  - normalization references enter deployment actor inputs
  - normalization reference fields are registered as evaluation metrics
source_awareness_required: true
rule_basis:
  - EC-RULE-001
  - EC-RULE-004
  - EC-RULE-008
  - EC-RULE-010
  - EC-RULE-028
  - EC-RULE-029
  - EC-RULE-034
relevant_lessons:
  - L001_metric_governance_first
  - L002_effective_success_alias_risk
  - L004_reliability_plateau_before_resource_objective
  - L009_dec_pomdp_boundary_before_actor
  - L010_training_after_oracle_baseline_contracts
required_tests:
  - Stage 5.3 document exists and states source evidence and policy
  - selector chooses positive latency and energy references from feasible source rows
  - selector reports eligible and excluded row counts
  - selected references populate a Stage 5.2 surrogate config
  - report builder keeps training and weight calibration blocked
  - replay script prints the Stage 5.3 report
  - source scan rejects training model v5 and legacy metric terms
forbidden_v5_inheritance:
  - old reward formulas weights penalties or sentinel constants
  - old effective-success metric aliases
  - old phase scripts as reward implementation
  - full-mask optimality assumptions
  - fixed 0.5 deployment threshold defaults
  - actor global-info or oracle-label leakage
expected_outputs:
  - fixed Stage 5.3 normalization reference record
  - Stage 5.2 surrogate config compatibility check
  - blocked work list for reward weights training model work final tau and v5 migration
  - recommended Stage 5.4 report integration task
