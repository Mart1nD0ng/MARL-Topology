id: stage22_action_semantics_ab_full_gnn_repair
name: Stage 22 Action Semantics AB Full GNN Repair
task_type: project_improvement
prompt: >
  Empirically compare directed outgoing edge actions against undirected
  physical link activation under the Stage 3/4 objective stack, build
  objective-aware teachers, train supervised MLP and full message-passing GNN
  actors for each option, evaluate actors and projected baselines under the
  same option-specific assembler, select one active action semantics, archive
  the losing semantics, replace the toy GNN, and stop without policy-gradient.
controlled_object: >
  Topology action semantics, objective-aware teacher targets, local actor GNN
  implementation, fair same-assembler supervised evaluation, and active
  semantics/model registries.
desired_state: >
  One action semantics is selected and promoted, the losing option is removed
  from active registries or marked archived, active GNN scoring uses real local
  message passing, actor inputs remain local-only, evidence uses Stage 3 URLLC
  and Stage 4 expected-initiator PBFT, and Stage 23 remains owner-gated.
relevant_lessons:
  - L001_metric_governance_first
  - L003_full_mask_not_oracle
  - L006_fixed_threshold_deployment_risk
  - L008_phase_script_entropy
  - L009_dec_pomdp_boundary_before_actor
  - L010_training_after_oracle_baseline_contracts
required_evidence:
  - Directed outgoing option is evaluated with selected_directed_edges and directed message-matrix semantics
  - Undirected physical-link option aggregates endpoint proposals into unique selected_physical_edges
  - Both options use Stage 3 finite-blocklength communication and Stage 4 expected-initiator PBFT objective evidence
  - Objective-aware teacher prefers tau feasibility then latency then energy then sparsity
  - Actor targets have high mid low spread, ranking pairs, and low-priority rejected or redundant examples
  - Critic-only global deltas remain separate from actor inputs
  - MLP and full message-passing GNN are trained and evaluated for both options
  - Main baselines are projected through the same option-specific assembler as actors
  - Stage 20 best actor metric is historical diagnostic only
  - One action semantics is selected and the losing option is inactive after closeout
  - Toy GNN active registry is replaced by full local message-passing GNN
hard_negative_checks:
  - PPO/MAPPO or policy-gradient is run during Stage 22
  - COMA is implemented or enabled
  - Transformer is implemented or enabled
  - Reward weights are tuned or final tau is selected
  - Actor input includes oracle labels global topology consensus_success_probability latency energy reward surrogate future outcome or critic deltas
  - Main evidence silently falls back to SimpleLinkModel or the min-link skeleton evaluator
  - Raw full graph or raw greedy baseline is used as the main comparison gate
  - Both action semantics remain active after selection
  - Toy edge-set aggregation GNN remains the active GNN model
  - v5 code is modified migrated formatted or used as a template
negative_checks:
  - PPO/MAPPO or policy-gradient is run during Stage 22
  - COMA is implemented or enabled
  - Transformer is implemented or enabled
  - Reward weights are tuned or final tau is selected
  - Actor input includes oracle labels global topology consensus_success_probability latency energy reward surrogate future outcome or critic deltas
  - Main evidence silently falls back to SimpleLinkModel or the min-link skeleton evaluator
  - Raw full graph or raw greedy baseline is used as the main comparison gate
  - Both action semantics remain active after selection
  - Toy edge-set aggregation GNN remains the active GNN model
  - v5 code is modified migrated formatted or used as a template
low_entropy_cleanup_requirement: >
  The selected action semantics must be the only active action semantics
  returned by the active registry. The losing semantics may remain only as
  archived Stage 22 A/B evidence, not as an active deployment path. The active
  model registry must point to the full message-passing GNN, not the archived
  toy model.
action_semantics_selection_rule: >
  Select by final-stack evidence: full-GNN projected tau-feasible rate, then
  lower latency and energy among feasible projected topologies, then lower
  high-score projection rejection and lower implementation entropy. Stage 20
  metrics are historical diagnostics only.
full_gnn_requirement: >
  Active GNN must use local ego-graph message passing with node embeddings,
  edge embeddings, at least two message-passing layers, edge-to-node and
  node-to-edge updates, permutation-invariant aggregation, masks, edge-score
  outputs only, and no global objective or oracle inputs.
post_task_self_review_requirement: >
  Closeout must answer which action semantics won, whether the loser was
  removed from active code, whether selected semantics aligns with evaluator
  topology semantics, whether the GNN is message-passing, whether toy GNN was
  removed or replaced, whether the teacher improved over projected greedy-only,
  whether baselines are fair, whether policy-gradient is still blocked, and
  the exact Stage 23 recommendation.
required_artifacts:
  - docs/STAGE22_ACTION_SEMANTICS_AB_FULL_GNN_REPAIR.md
  - docs/STAGE22_ACTION_SEMANTICS_SELECTION.md
  - docs/STAGE22_OBJECTIVE_AWARE_TEACHER.md
  - docs/STAGE22_FULL_GNN_ACTOR.md
  - src/marl_topology/policies/action_semantics.py
  - src/marl_topology/policies/physical_link_assembler.py
  - Stage 22 evidence, teacher, supervised, and evaluation modules
  - Stage 22 report script
  - Stage 22 unit and contract tests
  - PROJECT_STATE update after closeout
  - post-task self-review report
expected_evidence:
  - Directed i->j does not imply j->i
  - Physical i->j and j->i proposals aggregate to one physical edge
  - Full GNN output is permutation invariant to local neighbor ordering
  - Message passing changes outputs relative to isolated edge context
  - Target distributions are not uniformly high
  - Best selected full-GNN actor is evaluated under the selected semantics
  - Losing semantics is archived inactive after selection
  - Policy-gradient is not run in Stage 22
