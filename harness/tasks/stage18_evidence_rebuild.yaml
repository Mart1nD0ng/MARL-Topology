id: stage18_evidence_rebuild
name: Stage 18 Evidence Rebuild With Disambiguated Actor Features And Targets
task_type: project_improvement
prompt: >
  Rebuild Stage 16 learning evidence after Stage 17 actor-label
  disambiguation. Add actor-safe local topology, resource, projection,
  message, and link-estimate features; convert hard add/remove/keep actor
  labels into soft utility, pairwise ranking, and confidence-weighted targets;
  move global counterfactual and oracle effects to critic-only targets; rerun
  before/after contradiction diagnostics; update project state and closeout.
  Do not train, rerun Stage 11-15, implement models, add COMA/Transformer,
  tune reward weights, select final tau, modify v5, create checkpoints, or
  write training artifacts.
required_artifacts:
  - Stage 18 actor-safe feature rebuild module in src
  - Stage 18 disambiguated target module in src
  - Stage 18 learning evidence rebuild module in src
  - Stage 18 report-only replay script
  - Stage 18 feature target evidence and data-quality docs
  - unit tests for feature target and evidence rebuild behavior
  - contract tests for docs harness state and leakage boundaries
  - PROJECT_STATE update marking Stage 18 complete if gates pass
  - post-task self-review report
expected_evidence:
  - Stage 16 raw contradiction statistics are reproduced before rebuild
  - actor_safe_view adds local topology history resource projection message and link-estimate features
  - actor_safe_view rejects forbidden global objective oracle consensus reward future and critic fields
  - actor_target_view contains soft utility and pairwise ranking targets
  - hard labels are diagnostic or contradiction-free only
  - global edge-delta consensus latency energy feasibility and oracle targets are critic-only
  - after-rebuild hard-label allowed subset contradiction rate is reported
  - Stage 19 supervised actor rerun recommendation is owner-gated
rubric_items:
  - controlled_object_identified
  - desired_state_defined
  - state_variables_defined
  - sensors_defined
  - actuators_defined
  - feedback_loop_present
  - verification_plan_present
  - stability_risk_checked
  - observability_gap_checked
  - controllability_checked
  - disturbance_checked
  - decoupling_checked
  - reliability_or_error_control_checked
  - persistent_learning_update_suggested
pass_threshold: 85
minimum_required_items:
  - controlled_object_identified
  - desired_state_defined
  - sensors_defined
  - verification_plan_present
  - decoupling_checked
  - reliability_or_error_control_checked
negative_checks:
  - training or PPO MAPPO execution is introduced
  - Stage 11-15 is rerun during Stage 18
  - new actor critic GNN recurrent COMA or Transformer model is implemented
  - reward weights or final tau are tuned
  - checkpoint creation loading or training artifact writing is added
  - v5 code is modified migrated or used as a template
  - oracle labels enter actor view
  - global objective consensus latency energy reward or future fields enter actor_safe_view
  - global edge-delta targets enter actor_target_view
source_awareness_required: true
rule_basis:
  - EC-RULE-001
  - EC-RULE-004
  - EC-RULE-008
  - EC-RULE-010
  - EC-RULE-028
  - EC-RULE-029
  - EC-RULE-034
relevant_lessons:
  - L009_dec_pomdp_boundary_before_actor
  - L013_weak_exit_gate_patch_stage_cascade
  - L014_state_harness_self_review_drift
required_tests:
  - actor-safe topology history and resource fields exist
  - forbidden global actor fields are rejected
  - soft utility target is generated
  - pairwise ranking targets are generated
  - hard label is blocked when signature conflict exists
  - critic-only global targets are separated
  - Stage 18 before-after report runs and writes no artifacts
forbidden_v5_inheritance:
  - v5 actor global tensors
  - v5 replay labels
  - v5 reward weights
  - v5 checkpoint or phase-script logic
expected_outputs:
  - disambiguated Stage 18 evidence dataset
  - before-after contradiction report
  - Stage 19 supervised actor rerun gate recommendation
