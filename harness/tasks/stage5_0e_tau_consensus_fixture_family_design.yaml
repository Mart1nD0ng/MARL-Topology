id: stage5_0e_tau_consensus_fixture_family_design
name: Stage 5.0e Tau Consensus Fixture Family Design
task_type: harness_design
prompt: >
  Design the tau-consensus calibration fixture families needed before a future
  calibration run. Confirm coverage across geometry, channel/link, deadline,
  network resource, topology trade-off, and PBFT primary asymmetry while keeping
  fixture implementation, calibration runs, final tau selection, reward,
  training, model work, and v5 migration blocked.
required_artifacts:
  - Stage 5.0e fixture-family design documentation
  - updated tau calibration plan and Stage 5 contracts
  - project state update
  - harness task gate
  - contract tests for fixture-family coverage and forbidden shortcuts
  - post-task self-review report
expected_evidence:
  - fixture-family design states no fixtures are implemented and no calibration is run
  - required families cover geometry visibility channel link deadline network resource topology trade-off and PBFT primary asymmetry
  - Stage 4.8 rows remain smoke-test evidence only
  - topology variants include disconnected or weak baseline sparse candidate and dense full baseline
  - full graph remains baseline not oracle
  - oracle candidates are diagnostics only and not actor inputs
  - metric-valued outputs map only to registered concepts
  - final tau reward training actor critic model work and v5 migration remain blocked
rubric_items:
  - controlled_object_identified
  - desired_state_defined
  - state_variables_defined
  - sensors_defined
  - actuators_defined
  - feedback_loop_present
  - verification_plan_present
  - stability_risk_checked
  - observability_gap_checked
  - controllability_checked
  - disturbance_checked
  - decoupling_checked
  - reliability_or_error_control_checked
  - persistent_learning_update_suggested
pass_threshold: 85
minimum_required_items:
  - desired_state_defined
  - sensors_defined
  - verification_plan_present
  - reliability_or_error_control_checked
negative_checks:
  - final tau_consensus is selected or recommended
  - default numeric tau candidates are introduced
  - fixtures are implemented during Stage 5.0e
  - calibration is run during Stage 5.0e
  - Stage 4.8 smoke-test rows are represented as a final calibration set
  - full graph is treated as oracle or resource optimum
  - oracle-candidate labels are exposed as deployment actor inputs
  - topology diagnostics edge count timeout quorum or deadline are introduced as reward terms
  - unregistered metrics or legacy P_eff aliases enter the fixture schema
  - reward implementation reward weights training actor critic COMA GNN LSTM or v5 code is introduced
source_awareness_required: true
rule_basis:
  - EC-RULE-001
  - EC-RULE-004
  - EC-RULE-008
  - EC-RULE-010
  - EC-RULE-028
  - EC-RULE-029
  - EC-RULE-034
relevant_lessons:
  - L001_metric_governance_first
  - L002_effective_success_alias_risk
  - L003_full_mask_not_oracle
  - L004_reliability_plateau_before_resource_objective
  - L005_oracle_before_infeasible_claims
  - L010_training_after_oracle_baseline_contracts
  - L012_physics_can_mask_learning_claims
required_tests:
  - Stage 5.0e fixture-family design exists
  - design lists required family ids and coverage axes
  - design states Stage 4.8 is smoke-test only
  - design states no fixture implementation calibration run or final tau selection occurs
  - project state marks Stage 5.0e complete and keeps final tau reward training and v5 blocked
  - no reward training actor critic COMA GNN LSTM or v5 code is introduced
forbidden_v5_inheritance:
  - old reward formulas weights penalties or sentinel constants
  - old effective-success metric aliases
  - old phase scripts as fixture builders or calibration harness
  - full-mask optimality assumptions
  - fixed 0.5 deployment threshold defaults
  - actor global-info or oracle-label leakage
expected_outputs:
  - tau consensus fixture-family design document
  - updated Stage 5 calibration plan contracts and project state
  - tests and harness validation evidence
  - residual risk list for future fixture implementation and calibration run
