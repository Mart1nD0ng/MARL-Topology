id: stage8_policy_architecture_and_assembler
name: Stage 8 Policy Architecture And Topology Assembler
task_type: project_improvement
prompt: >
  Close Stage 8 by freezing policy architecture decisions, documenting the
  topology assembler contract, implementing non-learning actor-score and
  environment-side topology assembler interfaces, adding a centralized
  critic-interface scaffold, and proving that no model, training, checkpoint,
  COMA, PPO/MAPPO, transformer module, or v5 migration has been introduced.
required_artifacts:
  - Stage 8.1 policy architecture decision record
  - Stage 8.2 topology assembler contract
  - edge-score record and batch module
  - non-learning topology assembler module with diagnostics
  - actor edge-score interface scaffold
  - centralized critic interface scaffold
  - unit tests for actor interface assembler behavior and critic interface
  - contract tests for docs source scans harness task and project state
  - PROJECT_STATE update marking Stage 8 closed and Stage 9 owner-gated
  - post-task self-review report
expected_evidence:
  - actor output is edge score logit or probability and not final topology
  - deployment topology assembly is environment-side
  - deployment assembler rejects objective oracle reward future and PBFT reliability metadata
  - threshold and fixed top-k assemblers are marked baseline only
  - role-aware adaptive budget assembler respects role budgets
  - conflict-aware greedy assembler rejects invalid candidates capacity violations and conflicts
  - critic interface is centralized and training-only with required output heads
  - COMA and transformer are documented as deferred future ablations
  - no torch tensorflow neural model training checkpoint PPO MAPPO COMA implementation or v5 migration is added
rubric_items:
  - controlled_object_identified
  - desired_state_defined
  - state_variables_defined
  - sensors_defined
  - actuators_defined
  - feedback_loop_present
  - verification_plan_present
  - stability_risk_checked
  - observability_gap_checked
  - controllability_checked
  - disturbance_checked
  - decoupling_checked
  - reliability_or_error_control_checked
  - persistent_learning_update_suggested
pass_threshold: 85
minimum_required_items:
  - controlled_object_identified
  - desired_state_defined
  - sensors_defined
  - verification_plan_present
  - decoupling_checked
  - reliability_or_error_control_checked
negative_checks:
  - neural model implementation is added
  - training execution checkpoint creation or training artifact writing is introduced
  - deployment assembler consumes objective oracle reward future or PBFT reliability fields
  - actor input accepts global graph oracle label reward surrogate consensus metric or critic field
  - actor output emits selected global topology instead of edge scores
  - fixed top-k is presented as final policy rather than baseline only
  - COMA implementation is added
  - PPO or MAPPO implementation is added
  - transformer module is implemented in Stage 8
  - v5 code migration or phase-script logic is introduced
source_awareness_required: true
rule_basis:
  - EC-RULE-001
  - EC-RULE-004
  - EC-RULE-008
  - EC-RULE-010
  - EC-RULE-028
  - EC-RULE-029
  - EC-RULE-034
relevant_lessons:
  - L003_full_mask_not_oracle
  - L006_fixed_threshold_deployment_risk
  - L007_credit_calibration_not_impossibility
  - L008_phase_script_entropy
  - L009_dec_pomdp_boundary_before_actor
  - L010_training_after_oracle_baseline_contracts
required_tests:
  - actor interface input schema matches actor-safe schema
  - actor interface output contains edge scores and rejects forbidden topology oracle metric reward and target fields
  - threshold assembler works as baseline only
  - fixed top-k per-agent assembler works as baseline only
  - role-aware adaptive budget assembler respects role budgets
  - conflict-aware greedy assembler rejects invalid candidate tx capacity rx capacity channel conflict and interference conflict
  - deployment assembler rejects objective oracle reward edge-delta future and PBFT reliability metadata
  - critic interface is training-only and exposes value feasibility consensus latency energy and edge-delta heads
  - source scan rejects neural model training checkpoint COMA PPO MAPPO transformer dependency and v5 migration patterns
forbidden_v5_inheritance:
  - old actor critic checkpoint loading
  - old fixed 0.5 threshold deployment as default policy
  - old fixed top-k as final topology policy
  - old COMA or Q default architecture
  - old global actor tensors or oracle labels
  - old phase-script topology assembly
  - old reward formulas weights or metric aliases
expected_outputs:
  - Stage 8 architecture decision summary
  - topology assembler contract summary
  - non-learning assembler implementation evidence
  - actor and critic interface separation evidence
  - Stage 8 closure state
  - Stage 9 owner-decision recommendation
