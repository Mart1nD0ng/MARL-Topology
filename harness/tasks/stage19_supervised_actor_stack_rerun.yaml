id: stage19_supervised_actor_stack_rerun
name: Stage 19 Supervised Actor Stack Rerun On Disambiguated Evidence
task_type: project_improvement
prompt: >
  Rerun the supervised actor stack on Stage 18 disambiguated evidence in the
  owner-approved order: MLP, GNN, GRU on the real multi-step actor-safe subset,
  then LSTM only after GRU sanity passes. Use soft utility and pairwise ranking
  actor targets, keep critic-only global targets out of actor inputs, and close
  the stage with docs, tests, PROJECT_STATE, harness validation, and self-review.
  Do not run PPO/MAPPO, COMA, Transformer, scale-up training, reward-weight
  tuning, final tau selection, checkpoint creation, training artifact writes, or
  v5 modification.
required_artifacts:
  - Stage 19 supervised actor stack module in src
  - Stage 19 train script that prints a JSON report and writes no artifact
  - Stage 19 supervised actor stack report document
  - unit tests for Stage 19 feature batching and model rerun order
  - contract tests for Stage 19 docs harness state and boundary checks
  - PROJECT_STATE update marking Stage 19 complete if gates pass
  - post-task self-review report
expected_evidence:
  - Stage 18 disambiguated actor evidence is consumed
  - actor_safe_view fields are converted into the Stage 19 actor tensor schema
  - forbidden global objective oracle consensus reward future and critic fields stay out of actor inputs
  - MLP supervised rerun completes with finite non-collapsed outputs
  - GNN supervised rerun completes with finite non-collapsed outputs
  - GRU is tested on a real multi-step actor-safe subset
  - LSTM is tested only after GRU sanity passes
  - no policy-gradient critic COMA Transformer checkpoint artifact v5 reward tuning or final tau path is active
  - next-stage readiness is limited to supervised actor policy evaluation through the environment-side assembler
rubric_items:
  - controlled_object_identified
  - desired_state_defined
  - state_variables_defined
  - sensors_defined
  - actuators_defined
  - feedback_loop_present
  - verification_plan_present
  - stability_risk_checked
  - observability_gap_checked
  - controllability_checked
  - disturbance_checked
  - decoupling_checked
  - reliability_or_error_control_checked
  - persistent_learning_update_suggested
pass_threshold: 85
minimum_required_items:
  - controlled_object_identified
  - desired_state_defined
  - sensors_defined
  - verification_plan_present
  - observability_gap_checked
  - decoupling_checked
  - reliability_or_error_control_checked
negative_checks:
  - PPO MAPPO or policy-gradient rerun is introduced
  - COMA or Transformer implementation is introduced
  - critic training is rerun during Stage 19
  - checkpoint creation loading or training artifact writing is added
  - reward weights or final tau are tuned
  - v5 code is modified migrated or used as a template
  - oracle labels global topology consensus reward latency energy future outcome or critic targets enter actor inputs
  - LSTM is tested before GRU sanity passes
source_awareness_required: true
rule_basis:
  - EC-RULE-001
  - EC-RULE-004
  - EC-RULE-008
  - EC-RULE-010
  - EC-RULE-028
  - EC-RULE-029
  - EC-RULE-034
relevant_lessons:
  - L009_dec_pomdp_boundary_before_actor
  - L013_weak_exit_gate_patch_stage_cascade
  - L014_state_harness_self_review_drift
required_tests:
  - Stage 19 actor batch has 850 samples and 31 actor-safe features
  - Stage 19 ranking pairs are generated from Stage 18 actor targets
  - MLP and GNN reruns update actor parameters and produce finite losses
  - GRU sanity passes on real multi-step actor-safe sequence data
  - LSTM result exists only after GRU sanity passes
  - Stage 19 script writes no checkpoint or artifact
forbidden_v5_inheritance:
  - v5 actor global tensors
  - v5 phase scripts
  - v5 reward weights
  - v5 checkpoint logic
expected_outputs:
  - Stage 19 supervised actor stack JSON report
  - recommended Stage 20 supervised actor policy evaluation gate
