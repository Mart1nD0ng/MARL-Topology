id: topology_oracle_design
name: Topology Oracle Design
task_type: harness_design
prompt: >
  Design topology feasibility oracles, counterfactual evaluation rules, and regression cases
  without leaking oracle information to deployment actors.
required_artifacts:
  - oracle input output contract
  - feasible case list
  - infeasible case list
  - counterfactual replay rules
expected_evidence:
  - known scenario cases
  - protocol and physics coupling map
  - leakage prevention notes
  - regression test plan
rubric_items:
  - controlled_object_identified
  - desired_state_defined
  - state_variables_defined
  - sensors_defined
  - actuators_defined
  - feedback_loop_present
  - verification_plan_present
  - stability_risk_checked
  - noise_or_flakiness_checked
  - decoupling_checked
  - reliability_or_error_control_checked
pass_threshold: 80
minimum_required_items:
  - desired_state_defined
  - sensors_defined
  - verification_plan_present
negative_checks:
  - oracle labels become deployment actor inputs
  - feasibility ignores quorum or deadline
  - counterfactual replay changes scenario state unintentionally
source_awareness_required: true
rule_basis:
  - EC-RULE-003
  - EC-RULE-004
  - EC-RULE-008
  - EC-RULE-034

