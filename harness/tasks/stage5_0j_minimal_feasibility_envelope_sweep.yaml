id: stage5_0j_minimal_feasibility_envelope_sweep
name: Stage 5.0j Minimal Executable Feasibility Envelope Sweep
task_type: project_improvement
prompt: >
  Execute a minimal deterministic feasibility envelope sweep using the Stage
  5.0i design manifest. The sweep must hold tau_requirement_min = 0.9 fixed,
  produce sweep rows with registered metrics and diagnostics, and keep final
  tau selection, reward, training, model code, and v5 migration blocked.
required_artifacts:
  - executable Stage 5.0j sweep report builder
  - replay script for the sweep report
  - Stage 5.0j documentation
  - project state update
  - contract and unit tests
  - post-task self-review report
expected_evidence:
  - minimal executed sweeps include bandwidth deadline resource orthogonalization fault filter and topology candidate expansion
  - deferred sweeps include tx power payload and RSU height or placement
  - every sweep row has tau_requirement_min 0.9
  - sweep rows include required schema fields and registered metric-valued fields only
  - at least one infeasible-to-feasible transition exists
  - conservative fault filter does not increase reliability
  - full graph remains baseline not oracle
  - oracle labels and sweep labels are not actor inputs
  - final tau selection remains unset
  - reward training model and v5 migration remain blocked
rubric_items:
  - controlled_object_identified
  - desired_state_defined
  - state_variables_defined
  - sensors_defined
  - actuators_defined
  - feedback_loop_present
  - verification_plan_present
  - stability_risk_checked
  - observability_gap_checked
  - controllability_checked
  - disturbance_checked
  - decoupling_checked
  - reliability_or_error_control_checked
  - persistent_learning_update_suggested
pass_threshold: 85
minimum_required_items:
  - desired_state_defined
  - sensors_defined
  - verification_plan_present
  - reliability_or_error_control_checked
negative_checks:
  - final tau lower than 0.9 is selected or recommended
  - lower diagnostic tau values are treated as sweep thresholds
  - reward implementation reward weights training actor critic COMA GNN LSTM or v5 code is introduced
  - Monte Carlo sampling or subset enumeration is used for PBFT reliability
  - full graph is treated as oracle or resource optimum
  - oracle or sweep labels are exposed as deployment actor inputs
  - unregistered metrics or legacy P_eff aliases enter the sweep schema
source_awareness_required: true
rule_basis:
  - EC-RULE-001
  - EC-RULE-004
  - EC-RULE-008
  - EC-RULE-010
  - EC-RULE-028
  - EC-RULE-029
  - EC-RULE-034
relevant_lessons:
  - L001_metric_governance_first
  - L002_effective_success_alias_risk
  - L003_full_mask_not_oracle
  - L004_reliability_plateau_before_resource_objective
  - L005_oracle_before_infeasible_claims
  - L010_training_after_oracle_baseline_contracts
  - L012_physics_can_mask_learning_claims
required_tests:
  - Stage 5.0j builder returns fixed tau 0.9 and no final tau selection
  - minimal executed and deferred sweep ids match the Stage 5.0i plan
  - sweep rows contain required fields and valid probability latency energy ranges
  - infeasible-to-feasible transitions are present
  - conservative fault filter does not increase reliability
  - metric-valued fields remain registered concepts only
  - replay script prints Stage 5.0j JSON
  - no reward training actor critic COMA GNN LSTM or v5 code is introduced
forbidden_v5_inheritance:
  - old reward formulas weights penalties or sentinel constants
  - old effective-success metric aliases
  - old phase scripts as sweep implementation
  - full-mask optimality assumptions
  - fixed 0.5 deployment threshold defaults
  - actor global-info or oracle-label leakage
expected_outputs:
  - minimal executable feasibility envelope sweep report
  - sweep rows and summary evidence
  - tests and harness validation evidence
  - residual risk list for future Stage 3-backed sweep hardening
