expected_evidence:
  - Stage 27 manifest validates report artifacts under the approved result_save scope
  - Value critic fields exclude current reward, current consensus, current latency, and current energy
  - Diagnostic critic records are tagged action-conditioned and are not used as the value baseline
  - Return normalizer is fitted on train returns only and normalized train targets are centered/scaled
  - Future GAE path denormalizes critic predictions back to raw return scale
  - Frozen-policy critic dataset has at least 512 train and 128 eval transitions with nonzero reward and return variance
  - Actor checksum is unchanged and actor/policy-gradient update flags remain false
  - Enriched MLP critic and graph critic produce finite outputs
  - Graph critic is structure-sensitive and permutation-invariant
  - At least one critic passes minimum eval EV, value-return correlation, bias, scale, and advantage variance gates
  - Exactly one active future value critic is registered
  - PROJECT_STATE recommends Stage 28 but keeps scale-up and LSTM/recurrent PPO blocked pending owner decision
negative_checks:
  - Actor weights are updated or a policy-gradient update is run
  - Stage 25/26 policy training scripts are invoked as part of Stage 27
  - Reward weights, sampler, actor stack, tau, or active evaluator are changed
  - COMA, Transformer, GRU/LSTM, recurrent PPO, checkpoint creation, scale-up, or v5 migration occurs
  - Critic-only features are exported to deployment actor input
  - Report artifacts are written outside the manifest-approved Stage 27 artifact root
