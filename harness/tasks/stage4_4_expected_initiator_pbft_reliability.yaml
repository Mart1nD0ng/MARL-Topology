id: stage4_4_expected_initiator_pbft_reliability
name: Stage 4.4 Expected-Initiator PBFT Reliability
task_type: code_review
prompt: >
  Review the Stage 4.4 topology-level PBFT reliability model. Confirm the
  fixed-primary three-phase calculation is only a primary-specific helper, the
  topology consensus probability is the uniform average over initiator-as-primary
  reliability, conservative remove-largest filtering is not claimed as a strict
  Byzantine adversary model, and no view-change, Monte Carlo, subset
  enumeration, reward, training, actor critic code, or v5 migration is added.
required_artifacts:
  - expected-initiator PBFT reliability implementation
  - protocol contract update
  - metric contract update
  - Stage 4 reliability documentation update
  - unit tests for symmetric weak-primary improvement average and filtering cases
  - source negative test for no random sampling and no subset enumeration routes
  - project state update
  - post-task self-review report
expected_evidence:
  - symmetric complete graph gives equal per-primary reliability
  - weak primary has lower primary-specific reliability
  - topology reliability is the uniform average of per-primary values
  - improving one primary's outgoing links improves that primary and the average
  - fixed-primary path matches the helper result
  - remove-largest fault filter lowers or preserves reliability
  - source scan rejects Monte Carlo random sampling subset enumeration v5 reward and training routes
rubric_items:
  - controlled_object_identified
  - desired_state_defined
  - state_variables_defined
  - sensors_defined
  - actuators_defined
  - feedback_loop_present
  - verification_plan_present
  - stability_risk_checked
  - observability_gap_checked
  - controllability_checked
  - disturbance_checked
  - decoupling_checked
  - reliability_or_error_control_checked
  - persistent_learning_update_suggested
pass_threshold: 85
minimum_required_items:
  - desired_state_defined
  - sensors_defined
  - verification_plan_present
  - reliability_or_error_control_checked
negative_checks:
  - one fixed global primary is reported as topology reliability
  - remove-largest filtering is described as a strict Byzantine adversary model
  - view-change is implemented without a separate contract
  - Monte Carlo random sampling learned prediction or subset enumeration is used
  - reward timeout quorum penalty or effective-success alias is introduced
  - v5 consensus code phase scripts or metric aliases are copied
  - actor critic COMA GNN LSTM or training logic is added
source_awareness_required: true
rule_basis:
  - EC-RULE-001
  - EC-RULE-004
  - EC-RULE-008
  - EC-RULE-010
  - EC-RULE-028
  - EC-RULE-029
  - EC-RULE-034
relevant_lessons:
  - L001_metric_governance_first
  - L002_effective_success_alias_risk
  - L008_phase_script_entropy
  - L010_training_after_oracle_baseline_contracts
  - L012_physics_can_mask_learning_claims
required_tests:
  - symmetric complete graph equal per-primary reliability
  - weak primary lower reliability and average topology reliability
  - primary outgoing improvement monotonicity
  - uniform average equals manual average
  - fixed-primary helper compatibility
  - remove-largest filtering versus no filtering
  - source scan for no sampling no subset enumeration no v5 no reward no training
forbidden_v5_inheritance:
  - v5 consensus implementation
  - old P_succ or P_eff aliases
  - hard soft legacy effective-success modes
  - old reward shaping or protocol penalties
  - phase scripts
  - torch autograd or training-oriented protocol code
expected_outputs:
  - expected-initiator PBFT reliability record
  - tests and documentation
  - residual risks and Stage 4.5 recommendation
