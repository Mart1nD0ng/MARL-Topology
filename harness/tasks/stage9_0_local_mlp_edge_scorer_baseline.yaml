id: stage9_0_local_mlp_edge_scorer_baseline
name: Stage 9.0 Local MLP Edge Scorer Baseline Scaffold
task_type: project_improvement
prompt: >
  Implement the minimal Stage 9.0 LocalMLPEdgeScorer scaffold after unifying
  the active actor output schema around edge scores. Allow PyTorch only for the
  local MLP model scaffold. Do not train, do not create checkpoints, do not
  write training artifacts, do not implement PPO/MAPPO/COMA, and do not
  implement GNN, GRU, LSTM, or Transformer modules.
required_artifacts:
  - Stage 9.0 Local MLP edge scorer document
  - active actor output schema update making edge-score schema primary
  - legacy edge-decision schema marker showing activate is not active model output
  - LocalMLPEdgeScorer scaffold in src
  - unit tests for local feature encoding and edge-score output
  - source scan tests for no training checkpoint advanced architecture or v5 migration
  - contract tests for docs harness and project state
  - PROJECT_STATE update marking Stage 9.0 complete and awaiting owner decision
  - post-task self-review report
expected_evidence:
  - actor_policy_local_edge_score_output_v1 is the active actor output schema
  - activate belongs only to legacy local decisions or assembler-selected topology
  - LocalMLPEdgeScorer consumes only actor-safe local observations
  - LocalMLPEdgeScorer outputs EdgeScoreBatch records
  - parameters are frozen for Stage 9.0 or otherwise protected from training execution
  - no optimizer.step backward training loop checkpoint training artifact PPO/MAPPO/COMA GNN GRU LSTM Transformer or v5 route is added
rubric_items:
  - controlled_object_identified
  - desired_state_defined
  - state_variables_defined
  - sensors_defined
  - actuators_defined
  - feedback_loop_present
  - verification_plan_present
  - stability_risk_checked
  - observability_gap_checked
  - controllability_checked
  - disturbance_checked
  - decoupling_checked
  - reliability_or_error_control_checked
  - persistent_learning_update_suggested
pass_threshold: 85
minimum_required_items:
  - controlled_object_identified
  - desired_state_defined
  - sensors_defined
  - verification_plan_present
  - decoupling_checked
  - reliability_or_error_control_checked
negative_checks:
  - actor output schema still treats activate as active model output
  - LocalMLPEdgeScorer consumes global graph oracle label reward surrogate consensus metric or critic field
  - optimizer.step or backward execution is introduced
  - checkpoint creation loading or checkpoint path logic is introduced
  - training artifact writing is introduced
  - PPO/MAPPO/COMA implementation is introduced
  - GNN GRU LSTM or Transformer module is introduced
  - v5 code migration or phase-script logic is introduced
source_awareness_required: true
rule_basis:
  - EC-RULE-001
  - EC-RULE-004
  - EC-RULE-008
  - EC-RULE-010
  - EC-RULE-028
  - EC-RULE-029
  - EC-RULE-034
relevant_lessons:
  - L006_fixed_threshold_deployment_risk
  - L007_credit_calibration_not_impossibility
  - L008_phase_script_entropy
  - L009_dec_pomdp_boundary_before_actor
  - L010_training_after_oracle_baseline_contracts
required_tests:
  - active actor output schema is edge-score schema
  - legacy activate schema remains separate from active actor model output
  - local MLP feature encoder uses actor-safe local neighbor fields only
  - LocalMLPEdgeScorer emits EdgeScoreBatch and not selected topology
  - Stage 9.0 boundary report blocks training checkpoint and artifacts
  - source scan allows torch only in the local MLP scaffold and rejects training checkpoint PPO/MAPPO/COMA GNN GRU LSTM Transformer and v5 patterns
forbidden_v5_inheritance:
  - old actor checkpoint loading
  - old global actor tensors
  - old fixed threshold hard activation as model output
  - old PPO/MAPPO/COMA training routes
  - old GNN or recurrent actor default
  - old reward formulas weights or metric aliases
  - old phase-script topology logic
expected_outputs:
  - Stage 9.0 Local MLP scaffold summary
  - active edge-score schema confirmation
  - no-training evidence
  - validation results
  - Stage 9.1 owner-decision recommendation
