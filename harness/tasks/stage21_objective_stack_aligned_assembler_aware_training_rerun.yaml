id: stage21_objective_stack_aligned_assembler_aware_training_rerun
name: Stage 21 Objective Stack Aligned Assembler Aware Training Rerun
task_type: project_improvement
prompt: >
  Rebuild learning evidence with the Stage 3 URLLC finite-blocklength
  communication stack, Stage 4 expected-initiator PBFT reliability, Stage 5
  objective contract, and Stage 8 deployment assembler. Rebuild
  assembler-aware actor soft/ranking targets, rerun supervised MLP and GNN
  actors only, evaluate actors and projected baselines through the same
  assembler, and run a controlled policy-gradient pilot only if all Stage 21
  hard gates pass. Do not create Stage 21.1 planning stages, do not use the
  old minimal evaluator for main evidence, do not implement COMA or
  Transformer, do not tune reward weights, do not select final tau, do not
  create checkpoints, and do not modify v5.
controlled_object: >
  Stage 21 evidence, target, supervised actor rerun, fair assembler evaluation,
  and conditional policy-gradient gate.
desired_state: >
  Main evidence declares the Stage 3/4 objective-stack evaluator, actor targets
  are assembler-aware high/mid/low priority and pairwise ranking signals,
  actor inputs remain Dec-POMDP local only, MLP/GNN are rerun on the rebuilt
  target, main baselines are projected through the same assembler, and
  policy-gradient is either justified by passed gates or blocked with root
  cause.
relevant_lessons:
  - L001_metric_governance_first
  - L003_full_mask_not_oracle
  - L006_fixed_threshold_deployment_risk
  - L008_phase_script_entropy
  - L009_dec_pomdp_boundary_before_actor
  - L010_training_after_oracle_baseline_contracts
required_evidence:
  - Existing Stage 16 through Stage 20 evidence builders are audited for evaluator stack use
  - Stage 21 main evidence evaluator_id declares Stage 3 communication and Stage 4 PBFT objective stack
  - Every evidence row declares physics_regime_id protocol_model_id objective_contract_id and evaluator_id
  - Actor-safe view includes local history projection resource conflict link estimate and message summaries
  - Actor-safe view excludes oracle labels global topology consensus probability latency energy reward surrogate future outcome and edge-delta targets
  - Actor soft utility targets have high mid and low priority spread
  - Pairwise ranking targets exist
  - Invalid budget conflict redundant and high-cost rejected edges receive low or abstain priority
  - Critic global edge-delta targets remain critic-only
  - MLP and GNN supervised reruns report train validation ranking calibration discrimination and no-leakage diagnostics
  - Actor and baseline main comparisons use projected baselines under the same assembler constraints
  - Policy-gradient pilot runs only after objective target fairness projection performance and boundary gates pass
negative_checks:
  - Main evidence silently falls back to SimpleLinkModel or the minimal TopologyEvaluator min-link abstraction
  - Actor input includes oracle labels global topology consensus_success_probability latency energy reward surrogate future outcome or critic targets
  - Actor targets are uniformly high or hard contradictory add remove keep labels
  - Global edge-delta or oracle effects are used as deployment actor inputs
  - Raw full graph or raw greedy baseline is used as the main actor comparison instead of projected baselines
  - Policy-gradient runs after any hard Stage 21 gate fails
  - COMA or Transformer implementation is introduced
  - Reward weights or final tau are tuned
  - Checkpoint creation loading or uncontrolled training artifact writing is added
  - v5 code is modified migrated or used as a template
completion_gate:
  - Objective-stack alignment gate passes or failure review is produced
  - Actor target quality gate passes or failure review is produced
  - Fair same-assembler evaluation gate passes or failure review is produced
  - Projection mismatch gate passes or failure review is produced
  - Actor performance gate passes or failure review is produced
  - Boundary safety gate passes
policy_gradient_conditional_gate:
  - Policy-gradient pilot is automatically run only if all Stage 21 pass gates are true
  - Pilot uses best Stage 21 supervised actor same assembler same objective evaluator and fixed small scenario set
  - Pilot documents proposal logprob semantics and does not claim exact projected-topology logprob unless implemented
owner_boundary:
  - Owner approved Stage 21 execution through this goal only
  - Stage 22 scale repair or diagnostic work requires a new owner decision
post_task_self_review_requirement: >
  Closeout must include completed task, intended desired state, actual achieved
  state, evidence, tests, gates passed, gates deferred, new risks,
  regressions, candidate next tasks, recommended next task, and owner decision
  required.
required_artifacts:
  - Stage 21 objective-stack evidence builder in src
  - Stage 21 assembler-aware target builder in src
  - Stage 21 supervised MLP/GNN rerun and fair evaluation modules in src
  - Stage 21 report script that prints JSON and writes no checkpoint or result artifact
  - Stage 21 objective-stack aligned rerun rationale document
  - Stage 21 assembler-aware supervised rerun evaluation document
  - Stage 21 failure review or controlled policy-gradient pilot report
  - unit tests for evidence target training evaluation and conditional gates
  - contract tests for docs harness state and boundary checks
  - PROJECT_STATE update after Stage 21 pass or fail
  - post-task self-review report
expected_evidence:
  - Stage 16 through Stage 20 audit reports SimpleLinkModel or minimal TopologyEvaluator use where present
  - Stage 21 main evidence uses URLLC finite-blocklength link records and Stage 3 network communication records
  - Stage 21 consensus uses expected-initiator PBFT reliability and per-primary reliability
  - Stage 21 evidence contains feasible infeasible near-threshold sparse full projected greedy and oracle diagnostic rows when available
  - Stage 21 actor target distribution is nontrivial with high mid low and abstain examples
  - Stage 21 proposal rejection diagnostics split top proposal above-threshold quantile reason accepted and rejected score behavior
  - MLP and GNN train on Stage 21 actor-safe features and assembler-aware targets
  - Main actor-vs-baseline comparison uses full_graph_projected greedy_reliability_projected random_projected and actor_projected rows under one assembler family
  - Raw baselines are diagnostic only
  - Policy-gradient pilot report exists only when all Stage 21 hard gates pass
  - Failure review exists and policy-gradient is skipped when any Stage 21 hard gate fails
rubric_items:
  - controlled_object_identified
  - desired_state_defined
  - state_variables_defined
  - sensors_defined
  - actuators_defined
  - feedback_loop_present
  - verification_plan_present
  - stability_risk_checked
  - observability_gap_checked
  - controllability_checked
  - disturbance_checked
  - decoupling_checked
  - reliability_or_error_control_checked
  - persistent_learning_update_suggested
pass_threshold: 85
minimum_required_items:
  - controlled_object_identified
  - desired_state_defined
  - sensors_defined
  - verification_plan_present
  - observability_gap_checked
  - decoupling_checked
  - reliability_or_error_control_checked
source_awareness_required: true
rule_basis:
  - EC-RULE-001
  - EC-RULE-004
  - EC-RULE-008
  - EC-RULE-010
  - EC-RULE-028
  - EC-RULE-029
  - EC-RULE-034
required_tests:
  - Stage 21 evidence rows declare Stage 3/4 evaluator ids and no fallback flag
  - Stage 21 actor-safe rows reject forbidden global and objective fields
  - Stage 21 targets have nontrivial variance low priority examples and ranking pairs
  - Stage 21 critic global deltas are critic-only
  - Stage 21 fair evaluation uses projected baselines as the main comparison
  - Stage 21 policy-gradient conditional gate blocks on hard gate failure
forbidden_v5_inheritance:
  - v5 fixed threshold deployment
  - v5 actor global tensors
  - v5 phase scripts
  - v5 reward weights
  - v5 checkpoint logic
expected_outputs:
  - Stage 21 assembler-aware supervised rerun evaluation report
  - Stage 21 controlled policy-gradient pilot report or Stage 21 failure review
  - Stage 22 recommendation requiring owner decision
