id: review_reward_contract
name: Review Reward Contract
task_type: code_review
prompt: >
  Review reward proposals for reliability-as-constraint semantics, latency and energy objectives,
  excluded proxies, evaluation evidence, and reward-hacking risks.
required_artifacts:
  - reward contract table
  - excluded proxy list
  - evaluation metric plan
  - reward-hacking tests
expected_evidence:
  - consensus_success or consensus_success_probability threshold
  - latency and energy aggregation
  - metric-governance mapping
  - diagnostics separated from reward
rubric_items:
  - controlled_object_identified
  - desired_state_defined
  - sensors_defined
  - feedback_loop_present
  - verification_plan_present
  - stability_risk_checked
  - disturbance_checked
  - noise_or_flakiness_checked
  - decoupling_checked
  - reliability_or_error_control_checked
pass_threshold: 82
minimum_required_items:
  - desired_state_defined
  - sensors_defined
  - verification_plan_present
negative_checks:
  - old reward is copied
  - timeout or quorum is standalone reward
  - shaped reward improvement is reported without registered metric evidence
source_awareness_required: true
rule_basis:
  - EC-RULE-004
  - EC-RULE-028
  - EC-RULE-029
  - EC-RULE-034
