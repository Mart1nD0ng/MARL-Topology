id: scenario_fixture_contract
name: Scenario Fixture Contract
task_type: code_review
prompt: >
  Review Stage 2.5 deterministic scenario fixtures and their report path.
  Confirm fixtures are named, reproducible, use only the declared Stage 2
  deterministic-distance physics regime, broaden baseline/oracle sensors, and
  do not implement complex physics, reward, training, or v5 migration.
required_artifacts:
  - scenario fixture contract document
  - fixture definitions
  - fixture stack builder
  - scenario fixture report script
  - unit and contract tests
expected_evidence:
  - fixture ids are unique and match scenario ids
  - candidate edge ids are deterministic
  - expected oracle statuses match exhaustive small-graph results
  - expected full graph success values match baseline results
  - all report metric rows use registered names
  - no training reward model or v5 code appears
rubric_items:
  - controlled_object_identified
  - desired_state_defined
  - state_variables_defined
  - sensors_defined
  - actuators_defined
  - feedback_loop_present
  - verification_plan_present
  - stability_risk_checked
  - observability_gap_checked
  - controllability_checked
  - disturbance_checked
  - decoupling_checked
  - reliability_or_error_control_checked
  - persistent_learning_update_suggested
pass_threshold: 85
minimum_required_items:
  - desired_state_defined
  - sensors_defined
  - verification_plan_present
negative_checks:
  - fixture adds stochastic physics without seed or contract
  - fixture claims full graph is oracle or resource optimum
  - fixture oracle labels enter ActorObservation or action rules
  - fixture introduces unregistered metrics or reward fields
  - fixture imports v5 code starts training or adds actor critic model code
source_awareness_required: true
rule_basis:
  - EC-RULE-001
  - EC-RULE-004
  - EC-RULE-008
  - EC-RULE-010
  - EC-RULE-034
relevant_lessons:
  - L001_metric_governance_first
  - L003_full_mask_not_oracle
  - L005_oracle_before_infeasible_claims
  - L009_dec_pomdp_boundary_before_actor
  - L012_physics_can_mask_learning_claims
required_tests:
  - fixture ids unique and scenario ids match
  - graph edge ids deterministic across repeated builds
  - oracle status matches fixture expectation
  - full graph success matches fixture expectation
  - scenario fixture report checks pass
forbidden_v5_inheritance:
  - old scenario phase scripts
  - old metric aliases or effective-success modes
  - old reward formulas
  - full-mask optimality assumption
  - stochastic physics without explicit seed contract
expected_outputs:
  - fixture contract
  - scenario fixture report payload
  - tests and harness validation evidence
  - residual risk list for future physics and scenario coverage
