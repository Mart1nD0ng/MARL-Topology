id: stage5_0g_tau_consensus_calibration_report_run
name: Stage 5.0g Tau Consensus Calibration Report Run
task_type: project_improvement
prompt: >
  Run the tau-consensus calibration report over the Stage 5.0f alpha fixture
  suite using owner-supplied candidate tau values. The run must remain
  report-only and must not select the final tau_consensus, implement reward,
  train models, add actor/critic code, or migrate v5 code.
required_artifacts:
  - Stage 5.0g report-run documentation
  - source-kind correction for Stage 5.0f feasibility summary flags if needed
  - project state update
  - contract tests for report-run boundaries
  - post-task self-review report
expected_evidence:
  - report source is Stage 5.0f alpha fixture suite
  - candidate tau values are owner supplied and in range
  - candidate tau values are not default values
  - final_tau_consensus remains unset
  - tau_selected remains false
  - owner decision packet keeps owner_selected_tau unset
  - feasibility summary reports per-family counts
  - feasibility summary uses the correct Stage 5.0f source flag
  - metric-valued fields remain registered concepts only
  - full graph remains baseline and not oracle
  - oracle labels remain absent from deployment actor inputs
rubric_items:
  - controlled_object_identified
  - desired_state_defined
  - state_variables_defined
  - sensors_defined
  - actuators_defined
  - feedback_loop_present
  - verification_plan_present
  - stability_risk_checked
  - observability_gap_checked
  - controllability_checked
  - disturbance_checked
  - decoupling_checked
  - reliability_or_error_control_checked
  - persistent_learning_update_suggested
pass_threshold: 85
minimum_required_items:
  - desired_state_defined
  - sensors_defined
  - verification_plan_present
  - reliability_or_error_control_checked
negative_checks:
  - final tau_consensus is selected or recommended
  - owner supplied candidate tau is converted into a default threshold
  - tau feasibility is interpreted with the wrong inequality direction
  - Stage 5.0f fixture rows are mislabeled as Stage 4.8 smoke rows
  - reward implementation reward weights training actor critic COMA GNN LSTM or v5 code is introduced
  - full graph is treated as oracle or resource optimum
  - oracle-candidate labels are exposed as deployment actor inputs
  - unregistered metrics or legacy P_eff aliases enter the report schema
source_awareness_required: true
rule_basis:
  - EC-RULE-001
  - EC-RULE-004
  - EC-RULE-008
  - EC-RULE-010
  - EC-RULE-028
  - EC-RULE-029
  - EC-RULE-034
relevant_lessons:
  - L001_metric_governance_first
  - L002_effective_success_alias_risk
  - L003_full_mask_not_oracle
  - L004_reliability_plateau_before_resource_objective
  - L005_oracle_before_infeasible_claims
  - L010_training_after_oracle_baseline_contracts
  - L012_physics_can_mask_learning_claims
required_tests:
  - Stage 5.0g documentation records owner-supplied tau candidates and no final selection
  - report builder consumes Stage 5.0f source with source_is_alpha_fixture_suite true
  - Stage 5.0f feasibility summary flags do not claim Stage 4.8 smoke-only source
  - tau candidate rows remain non-default and non-selected
  - final_tau_consensus recommended_tau_candidate and owner_selected_tau remain unset
  - full graph not oracle and oracle labels not actor inputs
  - no reward training actor critic COMA GNN LSTM or v5 code is introduced
forbidden_v5_inheritance:
  - old reward formulas weights penalties or sentinel constants
  - old effective-success metric aliases
  - old phase scripts as calibration report implementation
  - full-mask optimality assumptions
  - fixed 0.5 deployment threshold defaults
  - actor global-info or oracle-label leakage
expected_outputs:
  - report-only tau-consensus calibration run summary
  - corrected source labeling for Stage 5.0f report summaries
  - tests and harness validation evidence
  - residual risk list for final tau selection and future calibration scope
