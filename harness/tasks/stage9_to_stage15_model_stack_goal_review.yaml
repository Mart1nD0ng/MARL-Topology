id: stage9_to_stage15_model_stack_goal_review
name: Stage 9 To Stage 15 Model Stack Goal Review
task_type: project_analysis
prompt: >
  Consolidate the owner-approved Stage 9 through Stage 15 model-stack history
  after the smoke path completes. Record model-stack evidence, validation
  results, remaining blockers, and why Stage 16 data quality work requires
  owner approval before any scale-up training.
required_artifacts:
  - Stage 9 to Stage 15 model-stack review document
  - PROJECT_STATE history entries for Stage 10 through Stage 15
  - validation summary for pytest and harness checks
  - explicit scale-up training blocker
expected_evidence:
  - Stage 10-15 smoke path history is represented without rerunning the stages
  - Local MLP actor centralized MLP critic GNN GRU LSTM and pilot boundaries are summarized
  - Stage 15 reports no violation-rate worsening and no actor collapse
  - tau_requirement_min 0.9 remains unmet in the pilot
  - temporal evidence is marked synthetic-only before Stage 16
  - owner approval is required before Stage 16
rubric_items:
  - controlled_object_identified
  - desired_state_defined
  - state_variables_defined
  - sensors_defined
  - actuators_defined
  - feedback_loop_present
  - verification_plan_present
  - stability_risk_checked
  - observability_gap_checked
  - controllability_checked
  - disturbance_checked
  - decoupling_checked
  - reliability_or_error_control_checked
  - persistent_learning_update_suggested
pass_threshold: 85
minimum_required_items:
  - controlled_object_identified
  - desired_state_defined
  - sensors_defined
  - verification_plan_present
  - decoupling_checked
negative_checks:
  - Stage 9 to Stage 15 review is treated as authorization for Stage 16 execution
  - small pilot evidence is presented as scale-up convergence evidence
  - tau 0.9 failure is hidden or reframed as solved
  - synthetic temporal evidence is presented as real multi-step scenario evidence
  - checkpoint artifact or training execution is added by the review task
source_awareness_required: true
rule_basis:
  - EC-RULE-001
  - EC-RULE-004
  - EC-RULE-008
  - EC-RULE-010
  - EC-RULE-028
  - EC-RULE-029
  - EC-RULE-034
relevant_lessons:
  - L009_dec_pomdp_boundary_before_actor
  - L010_training_after_oracle_baseline_contracts
  - L011_scale_up_requires_evidence_quality
required_tests:
  - model-stack review document exists
  - PROJECT_STATE records Stage 10 through Stage 15 history
  - validation summary mentions pytest and harness checks
  - Stage 16 remains owner-gated in the historical review
forbidden_v5_inheritance:
  - v5 training scripts
  - old reward weights
  - old checkpoint paths
  - old phase-script topology logic
expected_outputs:
  - Stage 9 to Stage 15 model-stack summary
  - Stage 16 data-quality recommendation
  - scale-up training blocker
