id: stage5_1_reward_implementation_plan
name: Stage 5.1 Reward Implementation Plan Without Code
task_type: project_improvement
prompt: >
  Design the future reward-surrogate implementation plan without writing reward
  code. The plan must preserve reliability as a constraint, latency and energy
  as objectives, a reliability plateau above tau, explicit normalization and
  weight requirements, Dec-POMDP actor leakage boundaries, replay-column
  boundaries, and reward-hacking tests. It must keep reward code, reward
  weights, training, model code, final tau selection, and v5 migration blocked.
required_artifacts:
  - Stage 5.1 reward implementation plan document
  - reward contract update
  - reward surrogate contract update
  - metric contract update
  - replay dataset contract update
  - project state update
  - contract tests for plan-only boundary
  - post-task self-review report
expected_evidence:
  - plan states reward is a training surrogate not an evaluation metric
  - plan uses tau_requirement_min 0.9 as requirement baseline and does not choose final tau
  - reliability plateau above tau is required
  - latency and energy normalization references must be explicit before code
  - timeout quorum deadline edge count density full graph and old v5 reward terms are forbidden
  - Dec-POMDP actor inputs exclude reward metrics oracle labels and global information
  - replay reward return advantage and value target fields remain outside deployment actor inputs
  - no reward module or training code is added
rubric_items:
  - controlled_object_identified
  - desired_state_defined
  - state_variables_defined
  - sensors_defined
  - actuators_defined
  - feedback_loop_present
  - verification_plan_present
  - stability_risk_checked
  - observability_gap_checked
  - controllability_checked
  - disturbance_checked
  - decoupling_checked
  - reliability_or_error_control_checked
  - persistent_learning_update_suggested
pass_threshold: 85
minimum_required_items:
  - desired_state_defined
  - sensors_defined
  - verification_plan_present
  - reliability_or_error_control_checked
negative_checks:
  - reward implementation code is added
  - reward weights are selected or calibrated
  - training actor critic COMA GNN LSTM or model code is introduced
  - final tau lower than 0.9 is selected or recommended
  - old v5 reward formulas weights aliases phase scripts or P_eff names are introduced
  - timeout quorum deadline edge count density full graph or full mask become active reward terms
  - reward return advantage value target oracle labels or evaluation metrics enter deployment actor inputs
source_awareness_required: true
rule_basis:
  - EC-RULE-001
  - EC-RULE-004
  - EC-RULE-008
  - EC-RULE-010
  - EC-RULE-028
  - EC-RULE-029
  - EC-RULE-034
relevant_lessons:
  - L001_metric_governance_first
  - L002_effective_success_alias_risk
  - L003_full_mask_not_oracle
  - L004_reliability_plateau_before_resource_objective
  - L005_oracle_before_infeasible_claims
  - L009_dec_pomdp_boundary_before_actor
  - L010_training_after_oracle_baseline_contracts
required_tests:
  - Stage 5.1 plan document exists and states no reward code
  - reward surrogate shape includes reliability violation latency and energy penalties
  - reliability plateau above tau is documented
  - plan blocks reward weights training model code final tau selection and v5 migration
  - Dec-POMDP and replay leakage guards are documented
  - project state marks Stage 5.1 complete and recommends Stage 5.2 skeleton only with owner approval
  - source tree contains no reward implementation module
forbidden_v5_inheritance:
  - old reward formulas weights penalties or sentinel constants
  - old effective-success metric aliases
  - old phase scripts as reward implementation
  - full-mask optimality assumptions
  - fixed 0.5 deployment threshold defaults
  - actor global-info or oracle-label leakage
expected_outputs:
  - Stage 5.1 plan-only reward-surrogate implementation design
  - future implementation sequence
  - blocked work list for reward weights training model work final tau and v5 migration
  - residual risk list for Stage 5.2
