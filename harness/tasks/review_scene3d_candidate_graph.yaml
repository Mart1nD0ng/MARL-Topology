id: review_scene3d_candidate_graph
name: Review Scene3D CandidateGraph
task_type: code_review
prompt: >
  Review Scene3D and CandidateGraph design or implementation for deterministic scenario
  loading, node identity, candidate edge identity, units, physics-regime declaration, and
  absence of premature simulator complexity.
required_artifacts:
  - scene contract
  - candidate graph contract
  - unit and identity test plan
  - physics regime declaration
expected_evidence:
  - deterministic seed or no-randomness declaration
  - node and edge identity checks
  - no duplicate candidate edges
  - mapping to GOAL_SKELETON layers
  - no v5 scenario code copy
rubric_items:
  - controlled_object_identified
  - desired_state_defined
  - state_variables_defined
  - sensors_defined
  - actuators_defined
  - feedback_loop_present
  - verification_plan_present
  - stability_risk_checked
  - disturbance_checked
  - noise_or_flakiness_checked
  - decoupling_checked
  - reliability_or_error_control_checked
pass_threshold: 82
minimum_required_items:
  - desired_state_defined
  - sensors_defined
  - verification_plan_present
negative_checks:
  - hides stochastic physics in scene loading
  - candidate graph contains duplicate or unstable edge ids
  - copies v5 scenario or phase code
  - compares policies without declared physics regime
source_awareness_required: true
rule_basis:
  - EC-RULE-001
  - EC-RULE-004
  - EC-RULE-010
  - EC-RULE-029
relevant_lessons:
  - L008_phase_script_entropy
  - L012_physics_can_mask_learning_claims
required_tests:
  - deterministic scene loading
  - node id uniqueness
  - candidate edge id uniqueness
  - physics regime declared before link claims
forbidden_v5_inheritance:
  - v5 scenario/config sprawl as default
  - v5 phase scripts
  - policy comparisons from old physics regimes
expected_outputs:
  - review verdict
  - missing contract list
  - required follow-up tests
