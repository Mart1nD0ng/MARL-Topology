id: implement_goal_skeleton_v0
name: Implement Goal Skeleton V0
task_type: project_scaffold
prompt: >
  Implement the minimal clean skeleton interfaces for Scene3D, CandidateGraph, LinkModel,
  TopologyEvaluator, ConsensusSuccess, LatencyEnergy, TopologyOracle, DecPOMDPEnv,
  PolicyBaselines, and MARLTraining later only as far as the active stage permits.
  Do not implement full 3D simulation, training, or migrated v5 model code.
required_artifacts:
  - layer interface summary
  - active lesson gate checklist
  - minimal contract tests
  - no-training and no-v5-copy statement
expected_evidence:
  - docs/V5_LESSON_TO_GATE_MAP.md references
  - metric governance check
  - protocol naming check
  - phase-script entropy check
  - physics regime declaration or explicit deferral
rubric_items:
  - controlled_object_identified
  - desired_state_defined
  - state_variables_defined
  - sensors_defined
  - actuators_defined
  - feedback_loop_present
  - verification_plan_present
  - stability_risk_checked
  - observability_gap_checked
  - controllability_checked
  - disturbance_checked
  - decoupling_checked
  - reliability_or_error_control_checked
  - persistent_learning_update_suggested
pass_threshold: 85
minimum_required_items:
  - desired_state_defined
  - sensors_defined
  - verification_plan_present
negative_checks:
  - implements full 3D physics instead of minimal contracts
  - starts training or adds deep learning dependencies
  - imports v5 code reward metrics phase scripts actor critic or COMA
  - reintroduces P_eff soft hard or legacy defaults
  - durable behavior is placed in phase scripts
source_awareness_required: true
rule_basis:
  - EC-RULE-001
  - EC-RULE-004
  - EC-RULE-007
  - EC-RULE-010
  - EC-RULE-013
relevant_lessons:
  - L001_metric_governance_first
  - L002_effective_success_alias_risk
  - L008_phase_script_entropy
  - L012_physics_can_mask_learning_claims
required_tests:
  - contract tests for any introduced layer interface
  - no cache artifact hygiene test
  - metric governance regression test
forbidden_v5_inheritance:
  - old reward formulas or weights
  - old metric names or effective-success mode taxonomy
  - old phase scripts as implementation
  - actor critic COMA or checkpoint loading
expected_outputs:
  - minimal src interfaces only when justified by contracts
  - updated tests and harness evidence
  - residual-risk note for deferred layers
