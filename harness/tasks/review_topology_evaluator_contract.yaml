id: review_topology_evaluator_contract
name: Review TopologyEvaluator Contract
task_type: code_review
prompt: >
  Review TopologyEvaluator, ConsensusSuccess, and LatencyEnergy contracts for metric
  governance, protocol naming, baseline separation, oracle boundaries, and reward-free
  evaluation semantics.
required_artifacts:
  - evaluator input output contract
  - consensus naming checklist
  - baseline role declaration
  - oracle and infeasibility boundary note
expected_evidence:
  - consensus_success or consensus_success_probability registration
  - quorum deadline and reward names separated
  - empty full sparse and oracle baseline roles separated
  - infeasible and unresolved outcomes are distinct
  - no v5 reward or phase logic copy
rubric_items:
  - controlled_object_identified
  - desired_state_defined
  - state_variables_defined
  - sensors_defined
  - actuators_defined
  - feedback_loop_present
  - verification_plan_present
  - stability_risk_checked
  - observability_gap_checked
  - controllability_checked
  - decoupling_checked
  - reliability_or_error_control_checked
pass_threshold: 86
minimum_required_items:
  - desired_state_defined
  - sensors_defined
  - verification_plan_present
negative_checks:
  - full-mask is described as oracle upper bound or resource optimum
  - policy failure is described as infeasibility without oracle proof
  - timeout quorum or reward is used as metric alias
  - old reward or effective-success taxonomy is copied
source_awareness_required: true
rule_basis:
  - EC-RULE-001
  - EC-RULE-004
  - EC-RULE-007
  - EC-RULE-010
  - EC-RULE-034
relevant_lessons:
  - L001_metric_governance_first
  - L002_effective_success_alias_risk
  - L003_full_mask_not_oracle
  - L004_reliability_plateau_before_resource_objective
  - L005_oracle_before_infeasible_claims
required_tests:
  - metric name separation
  - quorum and deadline boundaries when consensus is introduced
  - empty full sparse oracle baseline separation
  - unresolved is not infeasible
forbidden_v5_inheritance:
  - old reward
  - old P_eff mode taxonomy
  - phase34 or phase36 scripts
  - full-mask optimality assumption
expected_outputs:
  - evaluator contract verdict
  - required tests before reliance
  - active and deferred lesson gates
