id: review_link_model_contract
name: Review LinkModel Contract
task_type: code_review
prompt: >
  Review LinkModel contract or minimal implementation for units, deterministic sanity cases,
  output range, metric registration, and physics-regime boundaries. Do not implement full
  3D physical simulation as part of this gate.
required_artifacts:
  - link input output schema
  - units and range table
  - deterministic sanity cases
  - metric registry impact note
expected_evidence:
  - success probability range check
  - latency and energy nonnegative check
  - declared physics regime and seed behavior
  - no cross-regime evaluation claim
  - no v5 channel code copy
rubric_items:
  - controlled_object_identified
  - desired_state_defined
  - state_variables_defined
  - sensors_defined
  - actuators_defined
  - feedback_loop_present
  - verification_plan_present
  - stability_risk_checked
  - observability_gap_checked
  - disturbance_checked
  - noise_or_flakiness_checked
  - decoupling_checked
  - reliability_or_error_control_checked
pass_threshold: 84
minimum_required_items:
  - desired_state_defined
  - sensors_defined
  - verification_plan_present
negative_checks:
  - link success probability is used as reward without metric review
  - old P_eff soft hard legacy names are introduced
  - stochastic shadowing lacks seed control
  - v5 channel code is copied
source_awareness_required: true
rule_basis:
  - EC-RULE-001
  - EC-RULE-004
  - EC-RULE-010
  - EC-RULE-011
  - EC-RULE-029
relevant_lessons:
  - L001_metric_governance_first
  - L012_physics_can_mask_learning_claims
required_tests:
  - output ranges
  - units declared
  - deterministic sanity links
  - no unregistered metric fields
forbidden_v5_inheritance:
  - v5 channel formulas as default
  - v5 effective-success names
  - full simulator before contract tests
expected_outputs:
  - contract review report
  - required tests before implementation
  - deferred physics complexity list
