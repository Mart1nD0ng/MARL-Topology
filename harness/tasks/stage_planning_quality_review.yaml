id: stage_planning_quality_review
name: Stage Planning Quality Review
task_type: project_analysis
prompt: >
  Review a proposed or completed stage for stage sprawl, executable
  deliverable quality, completion gate strength, next-stage readiness, and
  PROJECT_STATE/harness/self-review synchronization. Classify the stage before
  it is treated as formally closed.
required_artifacts:
  - stage_id
  - stage_type
  - executable_deliverable
  - completion_gate
  - next_stage_readiness_gate
  - state_sync_required
  - harness_task_required
  - post_task_self_review_required
  - planning_only_allowed
  - blocker_removed
  - owner_decision_required
expected_evidence:
  - stage_id is named
  - stage_type is one of planning-only implementation-bearing exit-gate calibration evidence-generation model-training
  - executable_deliverable is concrete and runnable or the stage is explicitly planning-only
  - completion_gate proves the stage task is done
  - next_stage_readiness_gate states what makes the next stage safe or blocked
  - PROJECT_STATE sync is required for closeout
  - harness task registration is required for closeout
  - post-task self-review is required for closeout
  - planning-only stages cannot be consecutive unless owner approved and blocker_removed is true
  - implemented-but-unregistered stages are marked implemented_unregistered not closed
rubric_items:
  - controlled_object_identified
  - desired_state_defined
  - state_variables_defined
  - sensors_defined
  - actuators_defined
  - feedback_loop_present
  - verification_plan_present
  - stability_risk_checked
  - observability_gap_checked
  - controllability_checked
  - disturbance_checked
  - delay_or_async_risk_checked
  - noise_or_flakiness_checked
  - decoupling_checked
  - reliability_or_error_control_checked
  - persistent_learning_update_suggested
pass_threshold: 85
minimum_required_items:
  - controlled_object_identified
  - desired_state_defined
  - sensors_defined
  - verification_plan_present
  - decoupling_checked
  - reliability_or_error_control_checked
negative_checks:
  - stage has no executable deliverable and is not marked planning-only
  - two consecutive planning-only stages are proposed without owner approval
  - tests pass is the only exit condition
  - next-stage readiness gate is missing
  - PROJECT_STATE is stale after stage execution
  - harness task registry is missing after stage execution
  - post-task self-review is missing after stage execution
  - implemented_unregistered stage is claimed as formally closed
  - broad evidence expansion is recommended without a named blocker
source_awareness_required: true
rule_basis:
  - EC-RULE-001
  - EC-RULE-004
  - EC-RULE-008
  - EC-RULE-010
  - EC-RULE-028
  - EC-RULE-029
  - EC-RULE-034
stage_planning_checks:
  stage_id: required
  stage_type: required
  executable_deliverable: required
  completion_gate: required
  next_stage_readiness_gate: required
  state_sync_required: true
  harness_task_required: true
  post_task_self_review_required: true
  planning_only_allowed: conditional
  blocker_removed: required_when_planning_only
  owner_decision_required: true
relevant_lessons:
  - L012_stage_sprawl_design_only_loop
  - L013_weak_exit_gate_patch_stage_cascade
  - L014_state_harness_self_review_drift
required_tests:
  - stage planning lessons document exists
  - cybernetic-stage-planning skill exists
  - CODEX_WORKFLOW contains stage planning rules
  - AGENTS contains stage closeout and state sync rules
  - stage closeout template exists
  - PROJECT_STATE records current stage and recommended next task
forbidden_v5_inheritance:
  - v5 phase-script stage numbering
  - v5 training shortcuts
  - v5 checkpoint state
  - v5 reward-driven stage closure
expected_outputs:
  - stage planning quality verdict
  - stage type
  - executable deliverable
  - completion gate result
  - next-stage readiness result
  - state sync checklist
  - owner decision requirement
