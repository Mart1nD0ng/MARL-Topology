id: stage5_0f_tau_calibration_fixture_suite
name: Stage 5.0f Minimal Tau Calibration Fixture Suite
task_type: project_improvement
prompt: >
  Implement a minimal executable tau-consensus calibration alpha fixture suite.
  The suite must provide representative fixture families and rows consumable by
  the Stage 5.0d report builder, while keeping final tau selection, reward,
  training, model work, and v5 migration blocked.
required_artifacts:
  - executable calibration fixture suite module
  - Stage 5.0d report builder support for fixture rows
  - fixture suite replay script
  - Stage 5.0f implementation documentation
  - project state update
  - contract and unit tests
  - post-task self-review report
expected_evidence:
  - fixture families include clear free-space near-threshold blocked/NLoS interference deadline unreachable sparse-vs-dense and weak-primary coverage
  - each family has weak or disconnected baseline sparse candidate and dense full-graph baseline rows
  - required row fields are present and metric-valued fields map to registered concepts
  - consensus probabilities are in range and latency/energy are nonnegative
  - at least one non-saturated row exists
  - at least one sparse candidate has lower latency and energy than a full graph baseline
  - at least one failed or unreachable scheduled message has positive latency or energy
  - weak primary or center primary reliability spread is visible
  - Stage 5.0d report builder consumes the fixture suite source
rubric_items:
  - controlled_object_identified
  - desired_state_defined
  - state_variables_defined
  - sensors_defined
  - actuators_defined
  - feedback_loop_present
  - verification_plan_present
  - stability_risk_checked
  - observability_gap_checked
  - controllability_checked
  - disturbance_checked
  - decoupling_checked
  - reliability_or_error_control_checked
  - persistent_learning_update_suggested
pass_threshold: 85
minimum_required_items:
  - desired_state_defined
  - sensors_defined
  - verification_plan_present
  - reliability_or_error_control_checked
negative_checks:
  - final tau_consensus is selected or recommended
  - default numeric tau candidates are introduced
  - reward implementation reward weights training actor critic COMA GNN LSTM or v5 code is introduced
  - full graph is treated as oracle or resource optimum
  - oracle-candidate labels are exposed as deployment actor inputs
  - topology diagnostics edge count timeout quorum or deadline are introduced as reward terms
  - unregistered metrics or legacy P_eff aliases enter the fixture schema
source_awareness_required: true
rule_basis:
  - EC-RULE-001
  - EC-RULE-004
  - EC-RULE-008
  - EC-RULE-010
  - EC-RULE-028
  - EC-RULE-029
  - EC-RULE-034
relevant_lessons:
  - L001_metric_governance_first
  - L002_effective_success_alias_risk
  - L003_full_mask_not_oracle
  - L004_reliability_plateau_before_resource_objective
  - L005_oracle_before_infeasible_claims
  - L010_training_after_oracle_baseline_contracts
  - L012_physics_can_mask_learning_claims
required_tests:
  - fixture suite required families exist
  - fixture rows contain required fields and valid ranges
  - full graph is not oracle and oracle labels are not actor inputs
  - non-saturated sparse-vs-dense failed-message and weak-primary cases exist
  - Stage 5.0d report builder accepts Stage 5.0f fixture source rows
  - replay script prints fixture suite report
  - no reward training actor critic COMA GNN LSTM or v5 code is introduced
forbidden_v5_inheritance:
  - old reward formulas weights penalties or sentinel constants
  - old effective-success metric aliases
  - old phase scripts as fixture builders or calibration harness
  - full-mask optimality assumptions
  - fixed 0.5 deployment threshold defaults
  - actor global-info or oracle-label leakage
expected_outputs:
  - executable minimal tau calibration fixture suite
  - Stage 5.0d report integration with fixture suite rows
  - replay script and documentation
  - tests and harness validation evidence
  - residual risk list for future calibration report run
