id: stage16_learning_evidence_quality_improvement
name: Stage 16 Learning Evidence Quality Improvement
task_type: project_improvement
prompt: >
  Repair PROJECT_STATE and improve learning evidence/data quality after the
  Stage 9-15 smoke path. Build in-memory evidence coverage for tau feasible,
  near-threshold, hard infeasible, sparse/full resource contrast, primary
  placement contrast, interference/resource penalty, real multi-step
  actor-safe sequences, and rebuilt edge-delta targets. Do not train, do not
  expand models, do not write checkpoints or training artifacts, and do not
  modify v5.
required_artifacts:
  - PROJECT_STATE repair for post Stage 15 awaiting owner decision for Stage 16
  - Stage 16 learning evidence quality module in src
  - Stage 16 data-quality report document
  - unit tests for Stage 16 evidence coverage and edge-delta rebuild
  - contract tests for docs project state harness and forbidden implementation paths
  - harness registry entry for Stage 16
  - post-task self-review report
expected_evidence:
  - tau_requirement_min 0.9 feasible examples are present
  - near-threshold examples are present
  - infeasible hard examples are present
  - sparse feasible topology examples are present
  - full graph resource-dominated topology examples are present
  - weak-primary and center-primary contrast is present
  - interference penalty examples are present as a declared resource/interference proxy
  - real multi-step actor-safe sequence evidence comes from scenario mobility and time_step
  - add edge remove edge and keep edge delta targets are rebuilt
  - delta consensus_success_probability latency energy and surrogate diagnostics are reported
  - scale-up training remains blocked
rubric_items:
  - controlled_object_identified
  - desired_state_defined
  - state_variables_defined
  - sensors_defined
  - actuators_defined
  - feedback_loop_present
  - verification_plan_present
  - stability_risk_checked
  - observability_gap_checked
  - controllability_checked
  - disturbance_checked
  - noise_or_flakiness_checked
  - decoupling_checked
  - reliability_or_error_control_checked
  - persistent_learning_update_suggested
pass_threshold: 85
minimum_required_items:
  - controlled_object_identified
  - desired_state_defined
  - sensors_defined
  - verification_plan_present
  - decoupling_checked
  - reliability_or_error_control_checked
negative_checks:
  - no scale-up training is executed
  - PPO MAPPO COMA or Transformer implementation is introduced
  - new neural model architecture is added
  - checkpoint creation or loading is added
  - training artifact writing is added
  - reward weights or final tau are calibrated
  - oracle labels enter actor input
  - v5 code is modified migrated or used as a source template
source_awareness_required: true
rule_basis:
  - EC-RULE-001
  - EC-RULE-004
  - EC-RULE-008
  - EC-RULE-010
  - EC-RULE-028
  - EC-RULE-029
  - EC-RULE-034
relevant_lessons:
  - L009_dec_pomdp_boundary_before_actor
  - L010_training_after_oracle_baseline_contracts
  - L011_scale_up_requires_evidence_quality
required_tests:
  - Stage 16 evidence coverage includes tau feasible near-threshold hard infeasible sparse full primary contrast interference proxy and real multi-step rows
  - edge-delta target rebuild includes add remove keep feasibility-changing and metric deltas
  - actor-safe rows contain no oracle reward consensus or critic leakage
  - no result_save artifact is written by the Stage 16 builder
  - source scan rejects training checkpoint COMA PPO MAPPO Transformer and v5 implementation paths
forbidden_v5_inheritance:
  - v5 data migration
  - v5 reward weights
  - v5 checkpoint logic
  - v5 training loops
  - v5 phase-script evidence generators
expected_outputs:
  - Stage 16 data-quality report
  - edge-delta balance and oracle-gap summary
  - scale-up training blocker
  - recommended next owner-gated evidence action
