id: link_model_regime_review
name: Link Model Regime Review
task_type: code_review
prompt: >
  Review the Stage 2.7 link model regime. Confirm the current deterministic
  distance-only abstraction has declared inputs, outputs, units, assumptions,
  omitted components, nonclaims, and sanity tests before richer physics,
  reward, replay writing, or training work.
required_artifacts:
  - link model regime review document
  - regime metadata module
  - physics contract update
  - monotonicity and regime validation tests
  - project state update
expected_evidence:
  - active regime id is stage2_deterministic_distance
  - distance reliability latency and energy units are declared
  - reliability latency and energy sanity checks pass
  - omitted components such as LoS SINR interference and shadowing are explicit
  - no v5 channel code reward training or complex physics is added
rubric_items:
  - controlled_object_identified
  - desired_state_defined
  - state_variables_defined
  - sensors_defined
  - actuators_defined
  - feedback_loop_present
  - verification_plan_present
  - stability_risk_checked
  - observability_gap_checked
  - controllability_checked
  - disturbance_checked
  - decoupling_checked
  - reliability_or_error_control_checked
  - persistent_learning_update_suggested
pass_threshold: 85
minimum_required_items:
  - desired_state_defined
  - sensors_defined
  - verification_plan_present
negative_checks:
  - review silently adds LoS SINR interference shadowing or stochastic physics
  - report claims cross-regime policy quality from deterministic distance results
  - link success probability is used as reward without reward contract
  - v5 channel fading BLER resource-mask or phase-script logic is copied
  - actor critic COMA GNN LSTM training or dataset writer code is added
source_awareness_required: true
rule_basis:
  - EC-RULE-001
  - EC-RULE-004
  - EC-RULE-008
  - EC-RULE-010
  - EC-RULE-034
relevant_lessons:
  - L001_metric_governance_first
  - L003_full_mask_not_oracle
  - L010_training_after_oracle_baseline_contracts
  - L012_physics_can_mask_learning_claims
required_tests:
  - regime metadata declares units assumptions omitted components and nonclaims
  - link records validate against regime id
  - reliability is nonincreasing with distance
  - latency and energy are nondecreasing with distance
  - fixture link records carry the active physics regime
forbidden_v5_inheritance:
  - v5 channel or SINR implementations
  - v5 BLER or resource-mask logic
  - old reward formulas
  - phase scripts as physics implementation
  - cross-regime full-mask conclusions
expected_outputs:
  - regime review document
  - link regime metadata
  - tests and harness validation evidence
  - residual risk list for richer physics
