id: stage3_network_layer_review
name: Stage 3.4 Network Layer Review
task_type: code_review
prompt: >
  Review Stage 3.4 network communication implementation for selected topology
  semantics, active transmissions, resource assignments, interference groups,
  reachability, simple routing or broadcast primitive, delivery probability,
  network latency, and network energy.
required_artifacts:
  - network layer implementation
  - selected edge semantics check
  - resource assignment and interference tests
  - route or broadcast primitive tests
expected_evidence:
  - unselected edges produce no tx energy
  - same-resource active links can interfere
  - orthogonal resources reduce interference
  - disconnected topology lowers delivery or reachability
  - multi-hop latency and energy aggregation is declared
rubric_items:
  - controlled_object_identified
  - desired_state_defined
  - state_variables_defined
  - sensors_defined
  - actuators_defined
  - feedback_loop_present
  - verification_plan_present
  - stability_risk_checked
  - observability_gap_checked
  - controllability_checked
  - disturbance_checked
  - decoupling_checked
  - reliability_or_error_control_checked
pass_threshold: 85
minimum_required_items:
  - desired_state_defined
  - sensors_defined
  - verification_plan_present
negative_checks:
  - selected edge is treated as guaranteed packet or consensus success
  - network delivery is treated as PBFT consensus reliability
  - full graph is labeled oracle or resource optimum
  - hidden resource assignment changes interference
  - reward training actor critic COMA or v5 phase-script code is introduced
source_awareness_required: true
rule_basis:
  - EC-RULE-001
  - EC-RULE-004
  - EC-RULE-008
  - EC-RULE-010
  - EC-RULE-034
relevant_lessons:
  - L001_metric_governance_first
  - L003_full_mask_not_oracle
  - L005_oracle_before_infeasible_claims
  - L012_physics_can_mask_learning_claims
required_tests:
  - two_transmitters_interference network
  - orthogonal_channel_no_interference network
  - multi_hop_delivery network
  - resource_redundant_topology network
  - disconnected reachability network
forbidden_v5_inheritance:
  - old topology phase scripts
  - old full-mask optimality assumptions
  - old reward or metric aliases
expected_outputs:
  - network communication records and tests
  - no PBFT consensus metric or reward implementation
  - updated residual risks
