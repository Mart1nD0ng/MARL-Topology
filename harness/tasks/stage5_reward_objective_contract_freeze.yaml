id: stage5_reward_objective_contract_freeze
name: Stage 5.0 Reward Objective Contract Freeze
task_type: code_review
prompt: >
  Review the Stage 5.0 objective and reward-surrogate contract freeze. Confirm
  objective semantics are separated from future training surrogate semantics,
  consensus reliability is a constraint with tau_consensus left as a formal
  parameter, latency and energy are primary objectives, diagnostics remain
  diagnostics or declared tie-breakers, and no reward implementation, reward
  weights, training, actor critic code, or v5 migration is introduced.
required_artifacts:
  - OBJECTIVE_CONTRACT documentation
  - REWARD_SURROGATE_CONTRACT documentation
  - Stage 5.0 freeze documentation
  - REWARD_CONTRACT Stage 5.0 update
  - METRIC_CONTRACT Stage 5.0 note
  - project state update
  - contract tests for objective reward boundary and forbidden implementation routes
  - post-task self-review report
expected_evidence:
  - objective uses consensus_success_probability as feasibility constraint
  - objective minimizes latency and energy inside the feasible region
  - tau_consensus is distinct from Stage 4.8 audit diagnostic threshold
  - topology_diagnostics are diagnostic or tie-breaker only
  - future surrogate is labeled training-only and not implemented
  - reliability plateaus above tau_consensus by default
  - timeout quorum deadline density and edge count are forbidden standalone reward components
  - source scan rejects reward training actor critic COMA GNN LSTM and v5 routes
rubric_items:
  - controlled_object_identified
  - desired_state_defined
  - state_variables_defined
  - sensors_defined
  - actuators_defined
  - feedback_loop_present
  - verification_plan_present
  - stability_risk_checked
  - observability_gap_checked
  - controllability_checked
  - disturbance_checked
  - decoupling_checked
  - reliability_or_error_control_checked
  - persistent_learning_update_suggested
pass_threshold: 85
minimum_required_items:
  - desired_state_defined
  - sensors_defined
  - verification_plan_present
  - reliability_or_error_control_checked
negative_checks:
  - Stage 4.8 reliability_threshold 0.2 is copied as tau_consensus
  - reliability bonus above tau_consensus is introduced
  - timeout quorum deadline edge count density or full graph becomes standalone reward
  - topology diagnostics are promoted to primary objective without contract
  - unregistered metric appears in objective or reward surrogate
  - reward implementation or reward weight calibration is added
  - training actor critic COMA GNN LSTM or v5 code is introduced
source_awareness_required: true
rule_basis:
  - EC-RULE-001
  - EC-RULE-004
  - EC-RULE-008
  - EC-RULE-010
  - EC-RULE-028
  - EC-RULE-029
  - EC-RULE-034
relevant_lessons:
  - L001_metric_governance_first
  - L002_effective_success_alias_risk
  - L003_full_mask_not_oracle
  - L004_reliability_plateau_before_resource_objective
  - L005_oracle_before_infeasible_claims
  - L009_dec_pomdp_boundary_before_actor
  - L010_training_after_oracle_baseline_contracts
required_tests:
  - objective contract exists and declares feasibility plus latency energy objectives
  - reward surrogate contract exists and states future training surrogate only
  - tau_consensus is distinct from Stage 4.8 audit threshold
  - REWARD_CONTRACT records Stage 5.0 and keeps implementation blocked
  - no reward implementation module is added
  - no training actor critic COMA GNN LSTM code is added
  - forbidden standalone reward terms are not active components
  - metric governance still uses existing registered metrics only
forbidden_v5_inheritance:
  - old reward formulas weights penalties or sentinel constants
  - old effective-success metric aliases
  - old phase scripts as reward implementation
  - full-mask optimality assumptions
  - fixed 0.5 deployment threshold defaults
  - actor global-info or oracle-label leakage
expected_outputs:
  - objective contract document
  - reward surrogate contract document
  - Stage 5.0 freeze document
  - tests and harness validation evidence
  - residual risk list for tau_consensus and future reward implementation
