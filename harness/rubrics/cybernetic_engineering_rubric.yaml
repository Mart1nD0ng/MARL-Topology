rubric_id: cybernetic_engineering_rubric
version: draft-0.2
description: Scores whether a Codex work product follows phase-2 cybernetic engineering rules.
items:
- id: controlled_object_identified
  weight: 8
  description: The analyzed project/subsystem boundary and controlled object are named.
  pass_condition: Boundary and object are explicit.
  fail_condition: No clear object or boundary.
  evidence_to_collect:
  - control model
  - architecture notes
  - plan
- id: desired_state_defined
  weight: 8
  description: The desired behavior or target state is observable.
  pass_condition: Acceptance criteria are measurable.
  fail_condition: Goal is vague or untestable.
  evidence_to_collect:
  - acceptance criteria
  - test names
  - metric target
- id: state_variables_defined
  weight: 6
  description: Relevant state variables and outputs are separated.
  pass_condition: State and output are listed separately.
  fail_condition: State, output, and logs are conflated.
  evidence_to_collect:
  - model section
  - debug notes
- id: sensors_defined
  weight: 8
  description: Tests, logs, traces, metrics, or static checks are identified.
  pass_condition: At least one sensor exists for each critical output.
  fail_condition: Critical behavior is unobservable.
  evidence_to_collect:
  - test list
  - log query
  - metric name
  - trace field
- id: actuators_defined
  weight: 6
  description: Safe change levers are identified.
  pass_condition: Editable files/configs/interfaces are separated from fixed dependencies.
  fail_condition: Plan assumes unsafe or unavailable control levers.
  evidence_to_collect:
  - plan
  - diff scope
  - ownership notes
- id: feedback_loop_present
  weight: 8
  description: Work includes observe-change-observe feedback.
  pass_condition: Baseline and post-change checks are run or planned.
  fail_condition: Open-loop changes with no feedback.
  evidence_to_collect:
  - command output summary
  - CI result
  - review checklist
- id: verification_plan_present
  weight: 8
  description: Implementation or review has a verification plan.
  pass_condition: Plan names tests/checks and expected evidence.
  fail_condition: No verification path.
  evidence_to_collect:
  - test plan
  - rubric
  - final summary
- id: stability_risk_checked
  weight: 7
  description: Regression, oscillation, scope, and rollback risks are considered.
  pass_condition: Scope and stability risks are listed with checks.
  fail_condition: Broad changes without stability review.
  evidence_to_collect:
  - risk section
  - regression tests
  - rollback note
- id: observability_gap_checked
  weight: 6
  description: Missing or noisy signals are reported.
  pass_condition: Gaps are named and instrumentation is proposed.
  fail_condition: Blind spots are ignored.
  evidence_to_collect:
  - observability gap list
  - instrumentation proposal
- id: controllability_checked
  weight: 6
  description: The plan checks whether behavior is safely controllable.
  pass_condition: Unsafe actuators are avoided or gated.
  fail_condition: Agent changes fixed/external parts blindly.
  evidence_to_collect:
  - safe actuator list
  - approval note
- id: disturbance_checked
  weight: 6
  description: External disturbances and constraints are considered.
  pass_condition: Noise, external services, timing, and user data constraints are named when relevant.
  fail_condition: Assumes deterministic isolated behavior when not true.
  evidence_to_collect:
  - disturbance list
  - environment notes
- id: delay_or_async_risk_checked
  weight: 6
  description: Sampling, stale data, async queues, caches, and CI delays are considered.
  pass_condition: Freshness or delay handling is present.
  fail_condition: Acts on stale or delayed feedback.
  evidence_to_collect:
  - timestamps
  - commit SHA
  - queue metrics
- id: noise_or_flakiness_checked
  weight: 6
  description: Randomness, flaky tests, and performance variance are handled statistically.
  pass_condition: Repeated evidence or variance notes are present.
  fail_condition: One noisy run drives conclusion.
  evidence_to_collect:
  - repeat count
  - historical run data
  - variance metrics
- id: decoupling_checked
  weight: 7
  description: Coupled modules and non-target behavior are protected.
  pass_condition: Impact matrix or non-target regression checks exist.
  fail_condition: Shared changes lack side-effect checks.
  evidence_to_collect:
  - impact matrix
  - regression tests
- id: reliability_or_error_control_checked
  weight: 6
  description: High-risk outputs use redundancy, rollback, isolation, or false-success checks.
  pass_condition: Independent checks or rollback/isolation plan exists.
  fail_condition: Only happy-path success is checked.
  evidence_to_collect:
  - negative tests
  - rollback plan
  - secondary check
- id: persistent_learning_update_suggested
  weight: 4
  description: Repeated failures are converted into scoped durable improvement candidates.
  pass_condition: A draft AGENTS.md/skill/harness update is suggested when patterns repeat.
  fail_condition: Repeated failure pattern is left local and undocumented.
  evidence_to_collect:
  - skills_draft update
  - harness backlog
  - AGENTS proposal
audited_on: '2026-05-18'
source_awareness_policy: This rubric scores operational software-engineering behavior derived by analogy; it must not be cited
  as direct control-theory doctrine.
scoring_guidance:
  total_weight: 106
  suggested_pass_threshold: 75
  minimum_required_items:
  - desired_state_defined
  - sensors_defined
  - verification_plan_present
  evidence_policy: Score pass only from visible plan, diff, command output summary, tests, logs, metrics, review notes, or
    explicit residual-risk notes; do not infer absent evidence.
