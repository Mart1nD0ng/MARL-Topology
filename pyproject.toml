[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marl-topology"
version = "0.1.0"
description = "Clean-core scaffold for 3D V2X PBFT MARL topology-control simulation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "pyyaml",
    "networkx",
    "torch",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider --assert=plain"
markers = [
    "slow: end-to-end training/integration tests that build scenes and run the physics stack",
]
